<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Ideias — Carro na Rede</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
<link rel="apple-touch-icon" href="/assets/icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/tokens.css">
<script src="/assets/theme-toggle.js"></script>
<link rel="stylesheet" href="/assets/sidebar.css">
<script src="/assets/sidebar.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text);
  min-height:100vh;padding-bottom:3rem}
.wrap{max-width:44rem;margin:0 auto;padding:1.5rem 1.1rem 0}
h1{font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:900}
.sub{color:var(--text-mid);font-size:.87rem;margin-top:.3rem;line-height:1.5}

/* Escrever — primeira coisa da tela, sem nada antes */
.escrever{margin:1.2rem 0 1.6rem}
.escrever textarea{width:100%;min-height:5.5rem;resize:vertical;font-family:inherit;
  font-size:1rem;line-height:1.5;color:var(--text);background:var(--surface-raise);
  border:1px solid var(--line);border-radius:11px;padding:.8rem .9rem}
.escrever textarea:focus{outline:none;border-color:var(--accent)}
.linha-botao{display:flex;gap:.6rem;align-items:center;margin-top:.6rem}
.btn{font-family:inherit;font-size:.9rem;font-weight:700;padding:.7rem 1.3rem;
  border-radius:10px;border:none;background:var(--text);color:var(--surface);cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.dica{font-size:.75rem;color:var(--text-faint);line-height:1.4}

.grupo-tit{font-size:.63rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-faint);margin:1.6rem 0 .6rem}

.ideia{border:1px solid var(--line);border-radius:11px;background:var(--surface-raise);
  padding:.85rem .95rem;margin-bottom:.6rem}
.ideia .txt{font-size:.95rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.ideia .pe{display:flex;justify-content:space-between;align-items:center;gap:.6rem;
  flex-wrap:wrap;margin-top:.6rem}
.ideia .quando{font-size:.7rem;color:var(--text-faint)}
.acoes{display:flex;gap:.4rem;flex-wrap:wrap}
.acoes button{font-family:inherit;font-size:.72rem;padding:.32rem .7rem;border-radius:7px;
  border:1px solid var(--line);background:none;color:var(--text-mid);cursor:pointer}
.acoes button:hover{color:var(--text);border-color:var(--text)}
.acoes button.perigo:hover{color:var(--severity-crit);border-color:var(--severity-crit)}
.ideia.resolvida{opacity:.6}
.ideia.resolvida .txt{text-decoration:line-through;text-decoration-thickness:1px}

.vazio{border:1px dashed var(--line);border-radius:11px;padding:1.8rem 1.1rem;
  text-align:center;color:var(--text-mid);font-size:.88rem;line-height:1.6}

#tarja{position:fixed;left:50%;bottom:1.3rem;transform:translateX(-50%);z-index:60;
  background:var(--text);color:var(--surface);padding:.7rem 1.1rem;border-radius:9px;
  font-size:.86rem;max-width:min(92vw,30rem);text-align:center;white-space:pre-wrap;
  display:none;box-shadow:0 6px 24px rgba(0,0,0,.22)}
#tarja.erro{background:var(--severity-crit);color:#fff}
</style>
</head>
<body>

<div class="wrap">
  <h1>Ideias</h1>
  <p class="sub">Anote do jeito que vier. Uma linha basta, e não precisa fazer
  sentido agora — o Claude lê isto no começo de cada conversa.</p>

  <!-- Campo primeiro, lista depois: quem chega aqui vem para escrever,
       não para ler. -->
  <div class="escrever">
    <textarea id="texto" placeholder="Ex: ver se dá pra avisar quando um anúncio baixa de preço…"
              aria-label="Escrever ideia"></textarea>
    <div class="linha-botao">
      <button class="btn" id="btn-salvar">Anotar</button>
      <span class="dica">Ctrl+Enter também salva</span>
    </div>
  </div>

  <div id="lista"></div>
</div>

<div id="tarja"></div>

<script>
'use strict';

const API = '/api/fetch-anuncio?ideias=1';
let IDEIAS = [];

const esc = s => (s == null ? '' : String(s))
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const $ = id => document.getElementById(id);

function tarja(msg, cls, ms) {
  const el = $('tarja');
  el.textContent = msg;
  el.className = cls || '';
  el.style.display = 'block';
  clearTimeout(tarja._t);
  tarja._t = setTimeout(() => { el.style.display = 'none'; }, ms || 3500);
}

function quando(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const dias = Math.floor((Date.now() - d) / 86400000);
  if (dias === 0) return 'hoje, ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
  if (dias === 1) return 'ontem';
  if (dias < 7) return `há ${dias} dias`;
  return d.toLocaleDateString('pt-BR');
}

function render() {
  const novas   = IDEIAS.filter(i => i.status === 'nova');
  const outras  = IDEIAS.filter(i => i.status !== 'nova');

  const cartao = (i) => `
    <div class="ideia${i.status === 'nova' ? '' : ' resolvida'}">
      <div class="txt">${esc(i.texto)}</div>
      <div class="pe">
        <span class="quando">${quando(i.criada_em)}${i.status === 'feita' ? ' · feita' : i.status === 'descartada' ? ' · descartada' : ''}</span>
        <div class="acoes">
          ${i.status === 'nova'
            ? `<button onclick="marcar(${i.id},'feita')">✓ Feita</button>
               <button onclick="marcar(${i.id},'descartada')">Descartar</button>`
            : `<button onclick="marcar(${i.id},'nova')">↩ Reabrir</button>`}
          <button class="perigo" onclick="apagar(${i.id})">Apagar</button>
        </div>
      </div>
    </div>`;

  $('lista').innerHTML =
    (novas.length
      ? `<div class="grupo-tit">Anotadas (${novas.length})</div>` + novas.map(cartao).join('')
      : `<div class="vazio">Nenhuma ideia anotada.<br>Escreva a primeira aí em cima.</div>`)
    + (outras.length
      ? `<div class="grupo-tit">Já resolvidas (${outras.length})</div>` + outras.map(cartao).join('')
      : '');
}

async function carregar() {
  try {
    const r = await fetch(API);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    IDEIAS = await r.json();
    render();
  } catch (e) {
    console.error('[IDEIAS] falha ao carregar:', e);
    $('lista').innerHTML = `<div class="vazio">Não consegui carregar.<br>${esc(e.message)}</div>`;
  }
}

async function salvar() {
  const ta = $('texto');
  const texto = (ta.value || '').trim();
  if (!texto) { ta.focus(); return; }

  const btn = $('btn-salvar');
  btn.disabled = true;
  btn.textContent = 'Anotando…';
  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ texto }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
    // Só limpa depois de o servidor confirmar. Limpar antes já perdeu ideia
    // de gente em outros sistemas: o campo esvazia, a rede falha, e o texto
    // não existe em lugar nenhum.
    ta.value = '';
    tarja('✓ Anotado.');
    await carregar();
  } catch (e) {
    console.error('[IDEIAS] falha ao salvar:', e);
    tarja('Não consegui anotar: ' + e.message + '\nSeu texto continua aí.', 'erro', 7000);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Anotar';
  }
}

async function marcar(id, status) {
  try {
    const r = await fetch(`${API}&id=${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status }),
    });
    if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || 'HTTP ' + r.status);
    await carregar();
  } catch (e) { tarja('Falha: ' + e.message, 'erro'); }
}

async function apagar(id) {
  const alvo = IDEIAS.find(i => i.id === id);
  if (!confirm(`Apagar esta ideia?\n\n"${(alvo?.texto || '').slice(0, 90)}"`)) return;
  try {
    const r = await fetch(`${API}&id=${id}`, { method: 'DELETE' });
    if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || 'HTTP ' + r.status);
    await carregar();
  } catch (e) { tarja('Falha ao apagar: ' + e.message, 'erro'); }
}

$('btn-salvar').addEventListener('click', salvar);
$('texto').addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); salvar(); }
});

carregar();
</script>
</body>
</html>
