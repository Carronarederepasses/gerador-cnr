<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Registro de Vendas — Carro na Rede Repasses</title>
<!-- PWA — instalável como app -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
<link rel="apple-touch-icon" href="/assets/icon-512.png">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/tokens.css">
<script src="/assets/theme-toggle.js"></script>
<link rel="stylesheet" href="/assets/sidebar.css">
<script src="/assets/sidebar.js" defer></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text);line-height:1.5;padding:1.5rem 1rem 4rem}
  .wrap{max-width:1100px;margin:0 auto}

  header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-bottom:1.5rem;border-bottom:2px solid var(--text);padding-bottom:1rem}
  h1{font-family:'Playfair Display',serif;font-weight:900;font-size:1.9rem;letter-spacing:-.01em}
  header .sub{font-size:.82rem;color:var(--text-mid)}
  header a.voltar{font-size:.8rem;color:var(--text-mid);text-decoration:none;border-bottom:1px solid var(--line)}
  header a.voltar:hover{color:var(--text);border-color:var(--text)}

  .barra{display:flex;gap:.8rem;flex-wrap:wrap;align-items:end;background:var(--surface-raise);border:1px solid var(--line);border-radius:14px;padding:1.1rem;margin-bottom:1.2rem}
  .barra .campo{flex:1;min-width:160px}
  .barra .campo.busca{flex:2;min-width:220px}
  label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-mid);margin-bottom:.3rem;font-weight:500}
  input,select,textarea{width:100%;font-family:'DM Sans',sans-serif;font-size:.9rem;padding:.6rem .7rem;border:1px solid var(--line);border-radius:9px;background:var(--surface-raise);color:var(--text)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  button.btn{font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:500;padding:.62rem 1rem;border-radius:9px;border:1px solid var(--text);background:var(--text);color:var(--surface);cursor:pointer;transition:opacity .15s;white-space:nowrap}
  button.btn:hover{opacity:.85}
  button.btn.ghost{background:var(--surface-raise);color:var(--text)}

  .meta-linha{display:flex;justify-content:space-between;align-items:center;margin-bottom:.9rem;font-size:.82rem;color:var(--text-mid)}

  /* Cards de venda */
  .lista{display:flex;flex-direction:column;gap:1rem}
  .card{background:var(--surface-raise);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:.7rem}
  .card .topo{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem;flex-wrap:wrap}
  .card h3{font-family:'Playfair Display',serif;font-weight:700;font-size:1.12rem;line-height:1.25}
  .card .partes{display:grid;grid-template-columns:1fr 1fr;gap:.5rem 1.4rem;font-size:.84rem}
  .card .partes .bloco b{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-mid);font-weight:600;margin-bottom:.1rem}
  .card .partes .bloco span{color:var(--text-mid)}
  .card .valores{display:flex;gap:1.6rem;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:.6rem;font-size:.85rem}
  .card .valores .v b{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-mid);font-weight:600}
  .card .valores .v .num{font-weight:700;font-size:1rem}
  .card .datas{font-size:.8rem;color:var(--text-mid);display:flex;gap:1.2rem;flex-wrap:wrap}

  .badge{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:.25rem .6rem;border-radius:20px;white-space:nowrap}
  .badge.negociando{background:color-mix(in srgb, var(--accent) 15%, transparent);color:var(--accent)}
  .badge.pago{background:color-mix(in srgb, var(--severity-ok) 15%, transparent);color:var(--severity-ok)}
  .badge.retirado{background:color-mix(in srgb, var(--severity-warn) 15%, transparent);color:var(--severity-warn)}
  .badge.concluido{background:color-mix(in srgb, var(--severity-ok) 15%, transparent);color:var(--severity-ok)}
  .badge.cancelado{background:color-mix(in srgb, var(--severity-crit) 15%, transparent);color:var(--severity-crit)}

  /* Anexos */
  .anexos{border-top:1px dashed var(--line);padding-top:.7rem}
  .anexos .grupo{margin-bottom:.5rem}
  .anexos .grupo .gtit{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-mid);font-weight:600;margin-bottom:.3rem}
  .anexo-chips{display:flex;flex-wrap:wrap;gap:.4rem}
  .chip{display:inline-flex;align-items:center;gap:.4rem;font-size:.78rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.35rem .55rem;cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  .chip .x{color:var(--severity-crit);font-weight:700;opacity:.6}
  .chip .x:hover{opacity:1}
  .add-anexo{display:inline-flex;align-items:center;gap:.3rem;font-size:.78rem;background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:.35rem .6rem;color:var(--text-mid);cursor:pointer}
  .add-anexo:hover{border-color:var(--accent);color:var(--text)}

  .card .rodape{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.2rem}
  .card .rodape button{font-family:'DM Sans',sans-serif;font-size:.76rem;padding:.42rem .8rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text-mid);cursor:pointer}
  .card .rodape button:hover{border-color:var(--accent);color:var(--text)}
  .card .rodape button.del{color:var(--severity-crit)}

  .sep-mes{display:flex;align-items:center;gap:.9rem;margin:.6rem 0 .2rem}
  .sep-mes span{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:700;color:var(--text);white-space:nowrap}
  .sep-mes::after{content:'';flex:1;height:1px;background:var(--line)}

  .vazio{text-align:center;padding:4rem 1rem;color:var(--text-faint)}
  .vazio .ico{font-size:2.5rem;margin-bottom:.6rem}
  .erro{background:color-mix(in srgb, var(--severity-crit) 12%, var(--surface));border:1px solid color-mix(in srgb, var(--severity-crit) 40%, transparent);color:var(--severity-crit);padding:.9rem;border-radius:10px;margin-bottom:1rem;font-size:.86rem;display:none}

  /* Modal de formulário */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;z-index:40;padding:2rem 1rem;overflow-y:auto}
  .modal.show{display:flex}
  .modal .box{background:var(--surface-raise);border-radius:16px;max-width:680px;width:100%;padding:1.5rem;margin:auto 0}
  .modal h2{font-family:'Playfair Display',serif;font-size:1.4rem;margin-bottom:1rem}
  .form-sec{margin-bottom:1.1rem}
  .form-sec .stit{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:.3rem;margin-bottom:.7rem}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.7rem}
  .modal .acoes{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.2rem}
  textarea{resize:vertical;min-height:64px}
  .crm-combo{position:relative}
  .crm-drop{position:absolute;z-index:300;left:0;right:0;background:var(--surface-raise);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);max-height:200px;overflow-y:auto;display:none;top:calc(100% + 2px)}
  .crm-drop.show{display:block}
  .crm-opt{padding:.45rem .75rem;cursor:pointer;font-size:.82rem}
  .crm-opt:hover{background:var(--line)}
  .crm-opt-nome{font-weight:600}
  .crm-opt-info{font-size:.68rem;color:var(--text-mid);margin-top:.08rem}

  @media(max-width:560px){h1{font-size:1.5rem}.card .partes,.grid2,.grid3{grid-template-columns:1fr}}

  #cnr-toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--surface);font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:500;padding:.65rem 1.2rem;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.25);opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;z-index:9999;white-space:nowrap}
  #cnr-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #cnr-toast.erro{background:var(--severity-crit)}
</style>
</head>
<body>

<div id="cnr-toast"></div>
<div class="wrap" id="app">
  <header>
    <h1>Registro de Vendas</h1>
    <div class="sub">Carro na Rede Repasses — vendas fechadas, anexos e documentos</div>
  </header>

  <div class="erro" id="erro"></div>

  <div class="barra">
    <div class="campo busca">
      <label for="f-q">Buscar (comprador, vendedor, carro, placa)</label>
      <input id="f-q" type="text" placeholder="ex: João, Onix, ABC1D23..." />
    </div>
    <div class="campo">
      <label for="f-status">Status</label>
      <select id="f-status">
        <option value="">Todos</option>
        <option value="negociando">Negociando</option>
        <option value="pago">Pago</option>
        <option value="retirado">Retirado</option>
        <option value="concluido">Concluído</option>
        <option value="cancelado">Cancelado</option>
      </select>
    </div>
    <button class="btn" id="btn-nova">+ Nova venda</button>
    <button class="btn ghost" onclick="abrirRapida()" style="white-space:nowrap">⚡ Histórico rápido</button>
    <button class="btn ghost" onclick="exportarCSV()" style="white-space:nowrap">📥 CSV</button>
    <button class="btn ghost" id="btn-historico" onclick="toggleHistorico()" style="white-space:nowrap;opacity:.6">👁 Histórico</button>
  </div>

  <div class="meta-linha" style="display:flex;justify-content:space-between;align-items:center"><span id="contador"></span><button id="btn-ordem" class="btn ghost" style="font-size:.74rem;padding:.4rem .7rem">⬇ Mais recentes</button></div>
  <div class="lista" id="lista"></div>
</div>

<!-- ── Modal entrada rápida (histórico) ──────────────────────── -->
<div class="modal" id="modal-rap" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;align-items:center;justify-content:center;padding:1.5rem">
  <div class="box" style="max-width:420px;padding:1.4rem">
    <h2 style="font-family:'Playfair Display',serif;font-size:1.2rem;margin-bottom:1rem">⚡ Histórico rápido</h2>
    <div style="display:grid;gap:.7rem">
      <div><label>Carro *</label><input id="r-carro" type="text" placeholder="ex: Corolla XEI 2020"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.7rem">
        <div><label>Comprador *</label><input id="r-comprador" type="text" placeholder="Nome"></div>
        <div><label>Data da venda</label><input id="r-data" type="date" style="color-scheme:dark"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.7rem">
        <div><label>Valor da venda (R$)</label><input id="r-valor" type="text" inputmode="numeric" placeholder="ex: 85.000"></div>
        <div><label>Taxa CNR (R$)</label><input id="r-taxa" type="text" inputmode="numeric" placeholder="ex: 2.000"></div>
      </div>
    </div>
    <div style="display:flex;gap:.5rem;margin-top:1.1rem;flex-wrap:wrap">
      <button class="btn" onclick="salvarRapida(false)" style="flex:1">Salvar</button>
      <button class="btn" onclick="salvarRapida(true)" style="flex:1;opacity:.8">Salvar e próximo ↵</button>
      <button class="btn ghost" onclick="fecharRapida()">Cancelar</button>
    </div>
    <div id="r-contador" style="font-size:.72rem;color:var(--text-mid);margin-top:.5rem;text-align:center"></div>
  </div>
</div>

<!-- ── Modal formulário ───────────────────────────────────────── -->
<div class="modal" id="modal">
  <div class="box">
    <h2 id="modal-tit">Nova venda</h2>
    <input type="hidden" id="m-id" />

    <div class="form-sec">
      <div class="stit">Veículo <span id="toggle-manual" onclick="toggleManual()" style="float:right;font-size:.72rem;color:var(--accent);cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500">✏️ digitar manual</span></div>
      <!-- Busca por placa -->
      <div style="display:flex;gap:.5rem;align-items:flex-end;margin-bottom:.8rem">
        <div style="flex:1">
          <label style="font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-mid);display:block;margin-bottom:.3rem">🔍 Buscar pela placa (preenche o carro automaticamente)</label>
          <input id="m-placa-busca" placeholder="ABC1D23" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter'){event.preventDefault();buscarPlacaVenda()}" />
        </div>
        <button type="button" id="btn-placa-busca" onclick="buscarPlacaVenda()" class="btn" style="white-space:nowrap;flex-shrink:0">Buscar</button>
      </div>
      <div id="m-placa-st" style="font-size:.78rem;margin-bottom:.5rem;color:var(--text-mid);min-height:1.1em"></div>
      <!-- Cascata FIPE -->
      <div id="cascata-box" class="grid2">
        <div><label>Marca</label><select id="m-sel-marca" onchange="vMarca()"><option value="">Carregando marcas...</option></select></div>
        <div><label>Modelo</label><select id="m-sel-modelo" onchange="vModelo()" disabled><option value="">— selecione a marca</option></select></div>
        <div><label>Ano</label><select id="m-sel-ano" onchange="vAno()" disabled><option value="">— selecione o modelo</option></select></div>
        <div><label>Versão</label><select id="m-sel-versao" onchange="vVersao()" disabled><option value="">— selecione o ano</option></select></div>
      </div>
      <div id="m-fipe-st" style="font-size:.78rem;margin-top:.45rem;color:var(--text-mid);min-height:1.1em"></div>
      <!-- Manual (carros fora da FIPE) -->
      <div id="manual-box" class="grid2" style="display:none">
        <div><label>Marca</label><input id="m-marca" /></div>
        <div><label>Modelo</label><input id="m-modelo" /></div>
        <div><label>Versão</label><input id="m-versao" /></div>
        <div><label>Ano</label><input id="m-ano" /></div>
      </div>
      <div class="grid3" style="margin-top:.7rem">
        <div><label>Placa</label><input id="m-placa" /></div>
        <div><label>Cor</label><input id="m-cor" /></div>
        <div><label>KM</label><input id="m-km" type="number" inputmode="numeric" /></div>
        <div><label>Renavam</label><input id="m-renavam" /></div>
        <div><label>Chassi</label><input id="m-chassi" /></div>
      </div>
    </div>

    <div class="form-sec">
      <div class="stit">Vendedor / Origem (de quem veio o carro)</div>
      <div class="grid2" style="margin-bottom:.7rem">
        <div><label>Origem (cidade / de onde veio)</label><input id="m-origem" placeholder="ex: Garopaba - Paulo" /></div>
        <div><label>Nome do vendedor</label><input id="m-vendedor_nome" /></div>
      </div>
      <div class="grid2">
        <div><label>CPF / CNPJ</label><input id="m-vendedor_cpf" /></div>
        <div><label>Telefone</label><input id="m-vendedor_telefone" inputmode="tel" /></div>
      </div>
    </div>

    <div class="form-sec">
      <div class="stit">Comprador / Destino (pra onde foi)</div>
      <div class="grid2" style="margin-bottom:.7rem">
        <div><label>Destino (cidade / pra quem foi)</label><input id="m-destino" placeholder="ex: New Motors - Novo Hamburgo" /></div>
        <div><label>Nome do comprador</label>
          <div class="crm-combo" id="crm-combo">
            <input id="m-comprador_nome" autocomplete="off" placeholder="Buscar no CRM ou digitar..."
              oninput="filtrarCRM(this.value)" onfocus="filtrarCRM(this.value)"
              onchange="if(!this.value){document.getElementById('m-comprador_id').value='';}">
            <div class="crm-drop" id="crm-drop"></div>
          </div>
        </div>
      </div>
      <div class="grid2">
        <div><label>CPF / CNPJ</label><input id="m-comprador_cpf" /></div>
        <div><label>Telefone</label><input id="m-comprador_telefone" inputmode="tel" /></div>
      </div>
      <div style="margin-top:.6rem"><label>Por que esse comprador? — alimenta o Motor de Match</label>
        <select id="m-motivo_match">
          <option value="">— selecione</option>
          <option value="ja_compra_modelo">Já compra esse modelo</option>
          <option value="paga_rapido">Paga rápido / confiável</option>
          <option value="melhor_margem">Melhor margem</option>
          <option value="confianca">Confiança / relacionamento</option>
          <option value="regiao">Região / logística</option>
          <option value="primeiro_contato">Foi o primeiro a contatar</option>
          <option value="outro">Outro</option>
        </select>
      </div>
      <input type="hidden" id="m-comprador_id">
    </div>

    <div class="form-sec">
      <div class="stit">Valores</div>
      <div class="grid3">
        <div><label>Lucro / Taxa CNR (R$)</label><input id="m-taxa_intermediacao" type="number" inputmode="numeric" placeholder="ex: 2000" /></div>
        <div><label>Valor da venda (R$)</label><input id="m-valor_venda" type="number" inputmode="numeric" /></div>
        <div><label>Valor de compra — quanto o vendedor recebeu (R$)</label><input id="m-valor_compra" type="number" inputmode="numeric" /></div>
        <div><label>FIPE (R$)</label><input id="m-valor_fipe" type="number" inputmode="numeric" /></div>
        <div><label>Forma de pagamento</label><input id="m-forma_pagamento" placeholder="PIX, financiamento..." /></div>
        <div><label>Canal de origem — como chegou esse carro</label>
          <select id="m-canal_origem">
            <option value="">— selecione</option>
            <option value="captacao_ativa">Captação ativa</option>
            <option value="indicacao">Indicação</option>
            <option value="olx">OLX</option>
            <option value="instagram">Instagram</option>
            <option value="whatsapp">WhatsApp direto</option>
            <option value="facebook">Facebook</option>
            <option value="outro">Outro</option>
          </select>
        </div>
      </div>
    </div>

    <div class="form-sec">
      <div class="stit">Datas, Status & Documentação</div>
      <div class="grid3">
        <div><label>Data da venda</label><input id="m-data_venda" type="date" /></div>
        <div><label>Entrega / Retirada</label><input id="m-data_retirada" type="date" /></div>
        <div><label>Status da venda</label>
          <select id="m-status">
            <option value="fechada">Fechada</option>
            <option value="negociando">Negociando</option>
            <option value="pago">Pago</option>
            <option value="retirado">Retirado</option>
            <option value="concluido">Concluído</option>
            <option value="cancelado">Cancelado</option>
          </select>
        </div>
        <div><label>Documentação</label>
          <select id="m-doc_status">
            <option value="pendente">Pendente</option>
            <option value="entregue">Entregue</option>
            <option value="procuracao">Entregue (procuração)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="form-sec">
      <div class="stit">Observações</div>
      <textarea id="m-observacoes" placeholder="Detalhes do negócio, combinados, pendências..."></textarea>
    </div>

    <div class="acoes">
      <button class="btn ghost" id="m-cancelar">Cancelar</button>
      <button class="btn" id="m-salvar">Salvar venda</button>
    </div>
  </div>
</div>

<input type="file" id="file-input" accept="image/*,application/pdf" style="display:none" />

<script>
const $ = id => document.getElementById(id);

let _toastTimer;
function toast(msg, tipo = 'ok', duracao = 2800) {
  const el = $('cnr-toast');
  if (!el) return;
  clearTimeout(_toastTimer);
  el.textContent = msg;
  el.className = tipo === 'erro' ? 'erro show' : 'show';
  _toastTimer = setTimeout(() => el.className = '', duracao);
}
let KEY = sessionStorage.getItem('cnr_vendas_key') || '';
let VENDAS = [];
let ordemDesc = true; // true = venda mais recente primeiro

function ordenar(arr){
  return [...arr].sort((a,b)=>{
    const da=a.data_venda||'', db=b.data_venda||'';
    if(!da && !db) return 0;
    if(!da) return 1;   // sem data vai pro fim
    if(!db) return -1;
    return ordemDesc ? db.localeCompare(da) : da.localeCompare(db);
  });
}

const TIPOS = [
  ['comprovante_pagamento', 'Comprovantes de pagamento'],
  ['documento_carro', 'Documento do carro'],
  ['cautelar', 'Cautelar'],
  ['outro', 'Outros'],
];

const DOC_ROTULO = { pendente: 'Pendente', entregue: 'Entregue', procuracao: 'Entregue (procuração)' };

const moeda = n => (n || n === 0) ? Number(n).toLocaleString('pt-BR', {style:'currency', currency:'BRL'}) : '—';
const dataBR = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('pt-BR') : '—';
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function headers(extra) {
  const h = { 'Content-Type': 'application/json' };

let COMPRADORES_CRM = [];
(async () => {
  try {
    const r = await fetch('/api/compradores?ativo=true');
    if (r.ok) COMPRADORES_CRM = await r.json();
  } catch(_) {}
})();

function filtrarCRM(q) {
  const drop = document.getElementById('crm-drop');
  const term = (q || '').toLowerCase().trim();
  const matches = term
    ? COMPRADORES_CRM.filter(c => c.nome.toLowerCase().includes(term))
    : COMPRADORES_CRM;
  if (!matches.length) { drop.classList.remove('show'); return; }
  const moedaK = n => n ? 'R$' + Math.round(Number(n)/1000) + 'k' : '?';
  drop.innerHTML = matches.slice(0, 8).map(c => {
    const faixa = (c.preco_min || c.preco_max) ? moedaK(c.preco_min) + '–' + moedaK(c.preco_max) : '';
    const marcas = (c.marcas || []).slice(0, 3).join(', ');
    const info = [c.tipo?.toUpperCase(), faixa, marcas].filter(Boolean).join(' · ');
    return `<div class="crm-opt" onmousedown="selecionarCRM('${c.id}')">
      <div class="crm-opt-nome">${esc(c.nome)}</div>
      ${info ? `<div class="crm-opt-info">${info}</div>` : ''}
    </div>`;
  }).join('');
  drop.classList.add('show');
}

function selecionarCRM(id) {
  const c = COMPRADORES_CRM.find(x => x.id === id);
  if (!c) return;
  document.getElementById('m-comprador_nome').value = c.nome;
  document.getElementById('m-comprador_id').value = c.id;
  if (c.telefone) document.getElementById('m-comprador_telefone').value = c.telefone;
  document.getElementById('crm-drop').classList.remove('show');
}

(async function boot(){
  let r;
  try { r = await fetch('/api/vendas', { headers: headers() }); } catch(e) { return; }
  if (!r.ok) return;
  VENDAS = await r.json();
  render();

  // Vindo do catálogo ou negociações via "Registrar Venda" → abre modal pré-preenchido
  const p = new URLSearchParams(location.search);
  const campos = ['marca','modelo','versao','ano','placa','cor','km','valor_venda','valor_fipe'];
  const temDados = campos.some(c => p.has(c)) || p.has('comprador_nome') || p.has('comprador_telefone');
  if (temDados) {
    const veiculo = {};
    campos.forEach(c => { if (p.has(c)) veiculo[c] = p.get(c); });
    // Campos extras vindos de negociações
    if (p.has('comprador_nome'))    veiculo.comprador_nome      = p.get('comprador_nome');
    if (p.has('comprador_telefone')) veiculo.comprador_telefone = p.get('comprador_telefone');
    veiculo._fromCatalogo = true;
    abrirModal(veiculo);
    // Preenche CRM após abrir o modal
    if (veiculo.comprador_nome)    document.getElementById('m-comprador_nome').value = veiculo.comprador_nome;
    if (veiculo.comprador_telefone) document.getElementById('m-comprador_telefone').value = veiculo.comprador_telefone;
    history.replaceState({}, '', '/vendas.html');
  }
})();

// ── Carregar / filtrar ─────────────────────────────────────────
async function carregar() {
  const q = new URLSearchParams();
  if ($('f-q').value.trim())   q.set('q', $('f-q').value.trim());
  if ($('f-status').value)     q.set('status', $('f-status').value);
  try {
    const r = await fetch('/api/vendas?' + q.toString(), { headers: headers() });
    if (!r.ok) throw new Error((await r.json()).error || 'erro');
    VENDAS = await r.json();
    render();
  } catch (e) { mostrarErro(e.message); }
}
$('f-q').addEventListener('input', debounce(carregar, 350));
$('f-status').addEventListener('change', carregar);

function debounce(fn, ms){ let t; return (...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);}; }
function mostrarErro(m){ $('erro').textContent = m; $('erro').style.display = 'block'; setTimeout(()=>$('erro').style.display='none', 5000); }

const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function mesLabel(dataStr) {
  if (!dataStr) return 'Sem data';
  const [ano, mes] = dataStr.split('-');
  return MESES[parseInt(mes, 10) - 1] + '/' + ano;
}

let _mostrarHistorico = false;
function toggleHistorico() {
  _mostrarHistorico = !_mostrarHistorico;
  const btn = $('btn-historico');
  btn.style.opacity = _mostrarHistorico ? '1' : '.6';
  btn.textContent = _mostrarHistorico ? '🙈 Ocultar histórico' : '👁 Histórico';
  render();
}

function render() {
  const visiveis = _mostrarHistorico ? VENDAS : VENDAS.filter(v => v.canal_origem !== 'historico');
  $('contador').textContent = visiveis.length ? `${visiveis.length} venda(s)` : '';
  if (!visiveis.length) {
    const temHistorico = VENDAS.some(v => v.canal_origem === 'historico');
    $('lista').innerHTML = temHistorico && !_mostrarHistorico
      ? '<div class="vazio"><div class="ico">📋</div>Nenhuma venda real registrada ainda.<br><small style="opacity:.6">Clique em 👁 Histórico para ver os registros de retroalimentação.</small></div>'
      : '<div class="vazio"><div class="ico">📋</div>Nenhuma venda registrada ainda.<br>Clique em <b>+ Nova venda</b> pra começar.</div>';
    return;
  }
  const sorted = ordenar(visiveis);
  let html = '', mesAtual = null;
  for (const v of sorted) {
    const mes = mesLabel(v.data_venda);
    if (mes !== mesAtual) {
      html += `<div class="sep-mes"><span>${mes}</span></div>`;
      mesAtual = mes;
    }
    html += cardHTML(v);
  }
  $('lista').innerHTML = html;
}
function exportarCSV() {
  if (!VENDAS.length) { alert('Nenhuma venda para exportar.'); return; }
  const cols = ['data_venda','marca','modelo','versao','ano','placa','cor','km',
    'vendedor_nome','vendedor_telefone','comprador_nome','comprador_telefone',
    'origem','destino','valor_venda','valor_compra','taxa_intermediacao',
    'forma_pagamento','canal_origem','status','doc_status','data_retirada','observacoes'];
  const esc = v => v == null ? '' : '"' + String(v).replace(/"/g, '""') + '"';
  const linhas = [cols.join(';')];
  VENDAS.forEach(v => linhas.push(cols.map(c => esc(v[c])).join(';')));
  const blob = new Blob(['﻿' + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const mes = new Date().toISOString().slice(0, 7);
  a.download = `vendas-cnr-${mes}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

      `<span class="chip" onclick="abrirAnexo('${v.id}','${esc(a.path)}')">📎 ${esc(a.nome)} <span class="x" onclick="event.stopPropagation();removerAnexo('${v.id}','${esc(a.path)}')">✕</span></span>`
    ).join('');
    return `<div class="grupo"><div class="gtit">${rotulo}</div><div class="anexo-chips">${chips}<span class="add-anexo" onclick="addAnexo('${v.id}','${tipo}')">+ anexar</span></div></div>`;
  }).join('');

  return `<div class="card">
    <div class="topo">
      <h3>${esc(nomeCarro(v))}${v.placa ? ' · <span style="font-weight:400;color:var(--text-mid)">'+esc(v.placa)+'</span>' : ''}</h3>
      <span class="badge ${v.status}">${esc(v.status)}</span>
    </div>
    <div class="partes">
      <div class="bloco"><b>Origem (vendedor)</b><span>${esc(v.origem) || esc(v.vendedor_nome) || '—'}${v.origem && v.vendedor_nome ? ' · '+esc(v.vendedor_nome) : ''}${v.vendedor_telefone ? ' · '+esc(v.vendedor_telefone) : ''}</span></div>
      <div class="bloco"><b>Destino (comprador)</b><span>${esc(v.destino) || esc(v.comprador_nome) || '—'}${v.destino && v.comprador_nome ? ' · '+esc(v.comprador_nome) : ''}${v.comprador_telefone ? ' · '+esc(v.comprador_telefone) : ''}</span></div>
    </div>
    <div class="valores">
      <div class="v"><b>Lucro / Taxa CNR</b><span class="num" style="color:var(--severity-ok)">${moeda(v.taxa_intermediacao)}</span></div>
      ${v.valor_venda != null ? '<div class="v"><b>Venda</b><span class="num">'+moeda(v.valor_venda)+'</span></div>' : ''}
      ${v.valor_fipe != null ? '<div class="v"><b>FIPE</b><span class="num" style="color:var(--text-mid)">'+moeda(v.valor_fipe)+'</span></div>' : ''}
    </div>
    <div class="datas">
      <span>🗓️ Venda: <b>${dataBR(v.data_venda)}</b></span>
      <span>📦 Entrega: <b>${dataBR(v.data_retirada)}</b></span>
      <span>📄 Doc: <b>${DOC_ROTULO[v.doc_status] || '—'}</b></span>
      ${v.forma_pagamento ? '<span>💳 '+esc(v.forma_pagamento)+'</span>' : ''}
    </div>
    ${v.observacoes ? '<div style="font-size:.84rem;color:var(--text-mid)">📝 '+esc(v.observacoes)+'</div>' : ''}
    <div class="anexos">${gruposAnexo}</div>
    <div class="rodape">
      <button onclick="editar('${v.id}')">✏️ Editar</button>
      <button class="del" onclick="apagar('${v.id}')">🗑️ Excluir</button>
    </div>
  </div>`;
}

function abrirModal(v) {

let _rapContador = 0;
const parseBRv = s => { const l = (s||'').trim().replace(/[R$\s]/g,'').replace(/\./g,'').replace(',','.'); return l ? parseFloat(l) : null; };
function abrirRapida() {
  _rapContador = 0;
  $('r-carro').value = ''; $('r-comprador').value = ''; $('r-taxa').value = ''; $('r-valor').value = '';
  $('r-data').value = new Date().toISOString().slice(0,10);

  $('modal-rap').style.display = 'flex';
  setTimeout(() => $('r-carro').focus(), 80);
}
function fecharRapida() { $('modal-rap').style.display = 'none'; carregar(); }
async function salvarRapida(continuar) {
  const carro = $('r-carro').value.trim();
  const comprador = $('r-comprador').value.trim();
  if (!carro || !comprador) { alert('Preenche pelo menos o carro e o comprador.'); return; }
  const body = {
    modelo: carro,
    comprador_nome: comprador,
    data_venda: $('r-data').value || new Date().toISOString().slice(0,10),
    valor_venda: parseBRv($('r-valor').value),
    taxa_intermediacao: parseBRv($('r-taxa').value),
    status: 'concluida',
    canal_origem: 'historico',
  };
  try {
    const r = await fetch('/api/vendas', { method: 'POST', headers: headers(), body: JSON.stringify(body) });
    if (!r.ok) throw new Error((await r.json()).error || 'erro');
    _rapContador++;
    $('r-contador').textContent = `${_rapContador} registro${_rapContador > 1 ? 's' : ''} salvo${_rapContador > 1 ? 's' : ''} ✓`;

      $('r-carro').value = ''; $('r-comprador').value = ''; $('r-taxa').value = ''; $('r-valor').value = '';
      setTimeout(() => $('r-carro').focus(), 60);
    } else { fecharRapida(); }
  } catch(e) { alert('Erro: ' + e.message); }
}

// ── Cascata FIPE (reaproveitada do gerador) ────────────────────
const FBASE = '/api/fipe?path=';
let cascData = null, marcasCarregadas = false;
async function fipeGet(path){ const r = await fetch(`${FBASE}${encodeURIComponent(path)}`); if(!r.ok) throw new Error('FIPE '+r.status); return r.json(); }
function fipeSt(msg){ const e=$('m-fipe-st'); if(e) e.textContent = msg || ''; }
function resetSelV(id, txt){ const s=$(id); if(s){ s.innerHTML=`<option value="">${txt}</option>`; s.disabled=true; } }

async function carregarMarcasVenda(){
  if (marcasCarregadas) return;
  const sel = $('m-sel-marca');
  try {
    const marcas = await fipeGet('/marcas');
    sel.innerHTML = '<option value="">Selecione a marca</option>';
    marcas.forEach(m => { const o=document.createElement('option'); o.value=m.codigo; o.dataset.nome=m.nome; o.textContent=m.nome; sel.appendChild(o); });
    marcasCarregadas = true;
  } catch(e){ sel.innerHTML='<option value="">FIPE indisponível — use o manual</option>'; }
}

async function vMarca(){
  const sel=$('m-sel-marca'); const cod=sel.value;
  $('m-marca').value = sel.options[sel.selectedIndex]?.dataset.nome || '';
  $('m-modelo').value=''; $('m-versao').value=''; $('m-ano').value=''; $('m-valor_fipe').value='';
  resetSelV('m-sel-modelo','— selecione a marca'); resetSelV('m-sel-ano','— selecione o modelo'); resetSelV('m-sel-versao','— selecione o ano');
  cascData=null;
  if(!cod){ fipeSt(''); return; }
  fipeSt('Buscando modelos...');
  try {
    const data = await fipeGet(`/marcas/${cod}/modelos`);
    const bases=[...new Set((data.modelos||[]).map(m=>m.nome.split(/[\s\-\/.]+/)[0]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
    const sM=$('m-sel-modelo'); sM.innerHTML='<option value="">Selecione o modelo</option>';
    bases.forEach(b=>{const o=document.createElement('option');o.value=b;o.textContent=b;sM.appendChild(o);});
    sM.disabled=false; fipeSt(`${bases.length} modelos`);
  } catch(e){ fipeSt('Erro ao buscar modelos'); }
}
async function vModelo(){
  const cod=$('m-sel-marca').value; const base=$('m-sel-modelo').value;
  $('m-modelo').value=base; $('m-versao').value=''; $('m-ano').value=''; $('m-valor_fipe').value='';
  resetSelV('m-sel-ano','— selecione o modelo'); resetSelV('m-sel-versao','— selecione o ano'); cascData=null;
  if(!base) return;
  fipeSt('⏳ Buscando anos e versões... (alguns segundos)');
  try {
    const r=await fetch(`/api/fipe-anos-versoes?marca=${encodeURIComponent(cod)}&base=${encodeURIComponent(base.toLowerCase())}`);
    const data=await r.json(); if(!r.ok||data.error) throw new Error(data.error||'erro');
    cascData=data;

function vAno(){

// ── Busca veículo pela placa (APiBrasil) ───────────────────────
async function buscarPlacaVenda() {
  const placa = ($('m-placa-busca').value || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  const st = $('m-placa-st');
  if (!placa) { st.textContent = 'Digite a placa antes de buscar.'; return; }
  const btn = $('btn-placa-busca');
  btn.disabled = true; btn.textContent = '⏳ Buscando...';
  st.textContent = '';
  try {
    const r = await fetch('/api/placa', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ placa }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Erro na consulta');

    const inner = data.data || {};
    const fipe  = (inner.data || []).find(f => f.principal) || (inner.data || [])[0] || {};
    const vei   = inner.veiculo || {};

    const marca   = fipe.marca   || '';
    const modelo  = fipe.modelo  || '';
    const ano     = fipe.anoModelo ? String(fipe.anoModelo) : '';
    const cor     = vei.cor      || '';
    const chassi  = vei.chassi   || '';
    const fipeVal = fipe.valor   ? String(Math.round(Number(fipe.valor))) : '';

    // Ativa modo manual e preenche campos
    setModoManual(true);
    $('m-marca').value      = marca;
    $('m-modelo').value     = modelo;
    $('m-versao').value     = modelo; // versão = modelo completo da FIPE
    $('m-ano').value        = ano;
    $('m-cor').value        = cor;
    $('m-chassi').value     = chassi;
    $('m-placa').value      = placa;
    if (fipeVal) $('m-valor_fipe').value = fipeVal;

    st.style.color = 'var(--severity-ok)';
    st.textContent = `✓ ${marca} ${modelo} ${ano} — dados preenchidos. Confirme KM e valor de venda.`;
  } catch(e) {
    st.style.color = 'var(--severity-crit)';
    st.textContent = 'Erro: ' + e.message + ' — preencha manualmente.';
  } finally {
    btn.disabled = false; btn.textContent = 'Buscar';
  }
}

function setModoManual(manual){
  $('manual-box').style.display = manual ? 'grid' : 'none';
  $('cascata-box').style.display = manual ? 'none' : 'grid';
  $('m-fipe-st').style.display = manual ? 'none' : 'block';
  $('toggle-manual').textContent = manual ? '🔽 usar cascata FIPE' : '✏️ digitar manual';
  if (!manual){
    $('m-sel-marca').value='';
    resetSelV('m-sel-modelo','— selecione a marca'); resetSelV('m-sel-ano','— selecione o modelo'); resetSelV('m-sel-versao','— selecione o ano');
    cascData=null; fipeSt('');
    carregarMarcasVenda();
  }
}
function toggleManual(){ setModoManual($('manual-box').style.display === 'none'); }

  try {
    const url = id ? '/api/vendas?id=' + id : '/api/vendas';
    const r = await fetch(url, { method: id ? 'PATCH' : 'POST', headers: headers(), body: JSON.stringify(body) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'erro');
    const vendaId = data.id || id;
    fetch('/api/compradores?evento=1', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        tipo: id ? 'venda_atualizada' : 'venda_registrada',
        venda_id: vendaId,
        dados: { placa: body.placa, marca: body.marca, modelo: body.modelo, valor_venda: body.valor_venda },
      }),
    }).catch(() => {});
    fecharModal();
    await carregar();
    toast(id ? '✓ Venda atualizada!' : '✓ Venda registrada com sucesso!');
  } catch (e) {
    toast('Falha ao salvar: ' + e.message, 'erro', 6000);
  } finally {
    btn.disabled = false; btn.textContent = 'Salvar venda';
  }
};

async function apagar(id) {
  if (!confirm('Excluir esta venda e todos os anexos? Não dá pra desfazer.')) return;
  try {
    const r = await fetch('/api/vendas?id=' + id, { method: 'DELETE', headers: headers() });
    if (!r.ok) throw new Error((await r.json()).error || 'erro');
    carregar();
  } catch (e) { mostrarErro('Falha ao excluir: ' + e.message); }
}

// ── Anexos ─────────────────────────────────────────────────────
let _alvoAnexo = null;
function addAnexo(vendaId, tipo) {
  _alvoAnexo = { vendaId, tipo };
  $('file-input').value = '';
  $('file-input').click();
}

$('file-input').addEventListener('change', async (e) => {
  const alvo = _alvoAnexo;
  const files = [...e.target.files];
  if (!alvo || !files.length) return;
  try {
    for (const f of files) {
      $('contador').textContent = 'Enviando ' + f.name + '...';
      const mimeType = f.type || 'application/octet-stream';
      // 1. obter URL assinada para upload direto (sem limite de tamanho no Vercel)
      const prep = await fetch('/api/vendas?anexo=1&action=prepare-upload', {
        method: 'POST', headers: headers(),
        body: JSON.stringify({ vendaId: alvo.vendaId, tipo: alvo.tipo, mimeType, nome: f.name }),
      });
      if (!prep.ok) throw new Error((await prep.json()).error || 'erro ao preparar');
      const { path, uploadUrl } = await prep.json();
      // 2. upload direto ao Supabase Storage (bypass do Vercel)
      const up = await fetch(uploadUrl, { method: 'PUT', headers: { 'Content-Type': mimeType }, body: f });
      if (!up.ok) throw new Error('Falha no upload direto ao storage');
      // 3. registrar no banco
      const conf = await fetch('/api/vendas?anexo=1&action=confirm-upload', {
        method: 'POST', headers: headers(),
        body: JSON.stringify({ vendaId: alvo.vendaId, tipo: alvo.tipo, path, mimeType, nome: f.name }),
      });
      if (!conf.ok) throw new Error((await conf.json()).error || 'erro ao confirmar');
    }
    carregar();
  } catch (err) { mostrarErro('Falha ao anexar: ' + err.message); carregar(); }
});

async function abrirAnexo(vendaId, path) {
  try {
    const r = await fetch('/api/vendas?anexo=1&vendaId=' + vendaId + '&path=' + encodeURIComponent(path), { headers: headers() });
    if (!r.ok) throw new Error((await r.json()).error || 'erro');
    const { url } = await r.json();
    window.open(url, '_blank');
  } catch (e) { mostrarErro('Falha ao abrir: ' + e.message); }
}

async function removerAnexo(vendaId, path) {
  if (!confirm('Remover este anexo?')) return;
  try {
    const r = await fetch('/api/vendas?anexo=1', { method: 'DELETE', headers: headers(), body: JSON.stringify({ vendaId, path }) });
    if (!r.ok) throw new Error((await r.json()).error || 'erro');
    carregar();
  } catch (e) { mostrarErro('Falha ao remover: ' + e.message); }
}
