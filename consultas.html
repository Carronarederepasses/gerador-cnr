<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex,nofollow">
  <title>Consultas — Carro na Rede Repasses</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
  <link rel="apple-touch-icon" href="/assets/icon.svg">
  <script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0a0a0a;color:#f0f0f0;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px 60px}

    header{width:100%;max-width:480px;margin-bottom:36px}
    .nav{display:flex;justify-content:flex-end;margin-bottom:24px}
    .nav a{font-size:.74rem;color:#444;text-decoration:none;letter-spacing:.08em;border-bottom:1px solid #222;padding-bottom:1px}
    .nav a:hover{color:#888}
    .marca{font-size:.7rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:#444;margin-bottom:6px}
    h1{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;color:#fff;letter-spacing:-.02em}
    .sub{font-size:.78rem;color:#333;margin-top:6px}

    .card{background:#141414;border:1px solid #1e1e1e;border-radius:14px;padding:24px;width:100%;max-width:480px;margin-bottom:16px}
    .card h2{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:#fff;margin-bottom:16px;letter-spacing:-.01em}

    label{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;color:#444;margin-bottom:.4rem;font-weight:500}
    input,select{width:100%;background:#111;border:1px solid #2a2a2a;border-radius:9px;color:#fff;font-family:'DM Sans',sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:.1em;padding:13px 14px;outline:none;text-transform:uppercase;transition:border-color .2s;margin-bottom:12px}
    input::placeholder{color:#333;font-weight:400;letter-spacing:.05em;font-size:.9rem;text-transform:none}
    input:focus,select:focus{border-color:#555}
    select{font-size:.9rem;font-weight:500;letter-spacing:0;text-transform:none;cursor:pointer}
    select option{background:#141414}

    .botoes{display:flex;flex-direction:column;gap:10px;margin-top:4px}
    .btn{display:flex;align-items:center;gap:10px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;color:#e0e0e0;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:500;padding:14px 16px;cursor:pointer;text-align:left;transition:all .15s;width:100%}
    .btn:hover{border-color:#555;background:#222;color:#fff}
    .btn .ico{font-size:1.1rem;width:24px;text-align:center;flex-shrink:0}
    .btn .txt{flex:1}
    .btn .txt b{display:block;font-weight:700;margin-bottom:1px}
    .btn .txt span{font-size:.74rem;color:#555}
    .btn:hover .txt span{color:#777}
    .btn.destaque{background:#1a1a1a;border-color:#333}
    .btn.destaque:hover{border-color:#fff;background:#1e1e1e}

    .divider{border:none;border-top:1px solid #1a1a1a;margin:4px 0}

    @media(max-width:480px){h1{font-size:1.7rem}}
  </style>
</head>
<body>

<header>
  <div class="nav"><a href="/index.html">← Voltar ao gerador</a></div>
  <div class="marca">Carro na Rede Repasses</div>
  <h1>Consultas</h1>
  <div class="sub">Atalhos internos — débitos, histórico e dados do veículo</div>
</header>

<div class="card">
  <h2>Veículo</h2>
  <div>
    <label for="placa">Placa</label>
    <input id="placa" type="text" placeholder="ABC1D23" maxlength="8" autocomplete="off"
      oninput="this.value=this.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase()" />
  </div>
  <div>
    <label for="estado">Estado de emplacamento</label>
    <select id="estado">
      <option value="SC" selected>SC — Santa Catarina</option>
      <option value="SP">SP — São Paulo</option>
      <option value="RS">RS — Rio Grande do Sul</option>
      <option value="PR">PR — Paraná</option>
      <option value="RJ">RJ — Rio de Janeiro</option>
      <option value="MG">MG — Minas Gerais</option>
      <option value="GO">GO — Goiás</option>
      <option value="BA">BA — Bahia</option>
      <option value="PE">PE — Pernambuco</option>
      <option value="CE">CE — Ceará</option>
      <option value="MT">MT — Mato Grosso</option>
      <option value="MS">MS — Mato Grosso do Sul</option>
      <option value="ES">ES — Espírito Santo</option>
      <option value="DF">DF — Distrito Federal</option>
      <option value="PA">PA — Pará</option>
      <option value="AM">AM — Amazonas</option>
      <option value="outros">Outros estados</option>
    </select>
  </div>

  <div class="botoes">
    <button class="btn destaque" onclick="abrirDetran()">
      <span class="ico">🏛️</span>
      <span class="txt">
        <b>DETRAN — Débitos e multas</b>
        <span>IPVA · Licenciamento · Infrações · DPVAT</span>
      </span>
      <span style="color:#333;font-size:.8rem">↗</span>
    </button>

    <hr class="divider">

    <button class="btn" onclick="abrirAutoCrivo()">
      <span class="ico">🔍</span>
      <span class="txt">
        <b>Auto-crivo — Histórico completo</b>
        <span>Sinistro · Leilão · Gravame · Proprietários</span>
      </span>
      <span style="color:#333;font-size:.8rem">↗</span>
    </button>

    <button class="btn" onclick="abrirFipe()">
      <span class="ico">💰</span>
      <span class="txt">
        <b>Tabela FIPE</b>
        <span>Consultar valor de mercado</span>
      </span>
      <span style="color:#333;font-size:.8rem">↗</span>
    </button>

    <button class="btn" onclick="abrirGerador()">
      <span class="ico">📋</span>
      <span class="txt">
        <b>Gerar anúncio com essa placa</b>
        <span>Abre o gerador com a placa preenchida</span>
      </span>
      <span style="color:#333;font-size:.8rem">↗</span>
    </button>
  </div>
</div>

<script>
const DETRANS = {
  SC: 'https://www.detrannet.sc.gov.br/Servicos/ConsultarVeiculo',
  SP: 'https://www.detran.sp.gov.br/wps/portal/internet/servicos/veiculo/debitos-veicular',
  RS: 'https://www.detran.rs.gov.br/lista/2078/consulta-de-debitos-do-veiculo',
  PR: 'https://www.detran.pr.gov.br/Pagina/Consulta-de-debitos',
  RJ: 'https://www.detran.rj.gov.br/_monta_aplicacao.asp?cod_sistema=5&tipo=1',
  MG: 'https://www.detran.mg.gov.br/veiculo/consulta-de-debitos',
  GO: 'https://www.detran.go.gov.br/sub/debitos',
  BA: 'https://www.detran.ba.gov.br/servicos/veiculo/consulta-debito-veiculo',
  PE: 'https://www.detran.pe.gov.br/dran/index.php/veiculos/debitos-de-veiculo',
  CE: 'https://www.detran.ce.gov.br/index.php/servicos-para-veiculo/consulta-de-debito',
  MT: 'https://www.detran.mt.gov.br/-/consultar-debito-de-veiculo',
  MS: 'https://www.detran.ms.gov.br/veiculo/debitos',
  ES: 'https://detran.es.gov.br/servicos/veiculos/debitos',
  DF: 'https://www.detran.df.gov.br/servicos/veiculo/consulta-de-debitos',
  PA: 'https://www.detran.pa.gov.br/portal/veiculo/debito',
  AM: 'https://www.detran.am.gov.br/consultas/consultaDébitosVeiculo',
  outros: 'https://portalnatransito.com.br/consulta-debitos/',
};

function placa() { return document.getElementById('placa').value.trim(); }
function estado() { return document.getElementById('estado').value; }

function abrirDetran() {
  const url = DETRANS[estado()] || DETRANS['outros'];
  window.open(url, '_blank');
}

function abrirAutoCrivo() {
  window.open('https://www.autocrivo.com.br', '_blank');
}

function abrirFipe() {
  window.open('https://veiculos.fipe.org.br/', '_blank');
}

function abrirGerador() {
  const p = placa();
  // Abre o gerador e passa a placa via sessionStorage
  if (p) sessionStorage.setItem('consultas_placa', p);
  window.open('/index.html', '_blank');
}

// Enter consulta (abre DETRAN por padrão)
document.getElementById('placa').addEventListener('keydown', e => {
  if (e.key === 'Enter') abrirDetran();
});
</script>
</body>
</html>
