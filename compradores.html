<head>

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="/assets/icon-512.png">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text);min-height:100vh;padding-bottom:3rem}

header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.7rem;padding:1.1rem 1.4rem;border-bottom:1px solid var(--line)}
.logo{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700}
.logo span{display:block;font-size:.55rem;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--text-mid);margin-top:.1rem}
.nav{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.nav a{font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-mid);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:.38rem .7rem;transition:color .15s,border-color .15s}
.nav a:hover,.nav a.ativo{color:var(--text);border-color:var(--text)}
.nav button{font-size:.9rem;background:none;border:1px solid var(--line);border-radius:7px;color:var(--text-mid);padding:.38rem .6rem;cursor:pointer;line-height:1}

.wrap{max-width:900px;margin:0 auto;padding:1.4rem 1.2rem}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem;margin-bottom:1.4rem}
.kpi{background:var(--surface-raise);border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem}
.kpi-val{font-size:1.6rem;font-weight:700;font-family:'Playfair Display',serif;line-height:1}
.kpi-lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-mid);margin-top:.3rem}

/* Toolbar */
.toolbar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:1.1rem}
.toolbar input{flex:1;min-width:180px;font-family:'DM Sans',sans-serif;font-size:.88rem;padding:.55rem .8rem;border:1px solid var(--line);border-radius:9px;background:var(--surface-raise);color:var(--text)}
.toolbar input:focus{outline:none;border-color:var(--accent)}
.toolbar select{font-family:'DM Sans',sans-serif;font-size:.82rem;padding:.55rem .7rem;border:1px solid var(--line);border-radius:9px;background:var(--surface-raise);color:var(--text);cursor:pointer}
.btn-add{font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:var(--text);color:var(--surface);border:none;border-radius:9px;padding:.6rem 1.1rem;cursor:pointer;white-space:nowrap}
.btn-add:hover{opacity:.85}
.btn-agenda{font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:600;background:none;border:1px solid var(--line);border-radius:9px;padding:.6rem .9rem;cursor:pointer;color:var(--text-mid);white-space:nowrap;transition:all .15s}
.btn-agenda:hover{border-color:var(--accent);color:var(--text)}

/* Lista */
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.8rem}
.card{background:var(--surface-raise);border:1px solid var(--line);border-radius:12px;padding:1rem;display:flex;flex-direction:column;gap:.5rem;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem}
.card-nome{font-weight:700;font-size:.95rem;line-height:1.2}
.badge{font-size:.6rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .5rem;border-radius:20px;white-space:nowrap}
.badge-loja{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.badge-pf{background:color-mix(in srgb,var(--severity-ok) 15%,transparent);color:var(--severity-ok)}
.badge-inv{background:color-mix(in srgb,var(--severity-warn) 15%,transparent);color:var(--severity-warn)}
.badge-rev{background:color-mix(in srgb,var(--text-mid) 20%,transparent);color:var(--text-mid)}
.card-info{font-size:.78rem;color:var(--text-mid);display:flex;flex-direction:column;gap:.2rem}
.card-preco{font-size:.82rem;font-weight:600;color:var(--text)}
.card-marcas{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.2rem}
.tag{font-size:.62rem;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:.15rem .4rem;color:var(--text-mid)}
.card-acoes{display:flex;gap:.5rem;margin-top:.3rem;border-top:1px solid var(--line);padding-top:.6rem}
.btn-acao{flex:1;font-family:'DM Sans',sans-serif;font-size:.7rem;font-weight:600;padding:.45rem;border-radius:7px;border:1px solid var(--line);background:none;color:var(--text-mid);cursor:pointer;transition:all .15s;text-decoration:none;text-align:center}
.btn-acao:hover{border-color:var(--text);color:var(--text)}
.btn-acao.verde{border-color:color-mix(in srgb,var(--severity-ok) 40%,transparent);color:var(--severity-ok)}
.btn-acao.verde:hover{background:color-mix(in srgb,var(--severity-ok) 10%,transparent)}
.inativo{opacity:.45}
.card-hist{font-size:.72rem;color:var(--severity-ok);font-weight:600;margin-top:.1rem}

/* Empty */
.empty{text-align:center;padding:3rem 1rem;color:var(--text-faint)}
.empty-ico{font-size:2.5rem;margin-bottom:.5rem}
.empty-txt{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:flex-start;justify-content:center;overflow-y:auto;padding:1.5rem 1rem}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:520px;padding:1.5rem;margin:auto}
.modal-titulo{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;margin-bottom:1.2rem}
.field{margin-bottom:.9rem}
.field label{display:block;font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-mid);font-weight:600;margin-bottom:.35rem}
.field input,.field select,.field textarea{width:100%;font-family:'DM Sans',sans-serif;font-size:.9rem;padding:.6rem .75rem;border:1px solid var(--line);border-radius:9px;background:var(--surface-raise);color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field textarea{resize:vertical;min-height:70px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.marcas-wrap{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.4rem}
.marca-tag{font-size:.72rem;background:var(--surface-raise);border:1px solid var(--line);border-radius:6px;padding:.25rem .5rem;cursor:pointer;transition:all .15s}
.marca-tag.sel{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.modal-footer{display:flex;gap:.7rem;justify-content:flex-end;margin-top:1.2rem;padding-top:1rem;border-top:1px solid var(--line)}
.btn-cancel{font-family:'DM Sans',sans-serif;font-size:.8rem;background:none;border:1px solid var(--line);border-radius:9px;padding:.6rem 1.1rem;cursor:pointer;color:var(--text-mid)}
.btn-save{font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:600;background:var(--text);color:var(--surface);border:none;border-radius:9px;padding:.6rem 1.4rem;cursor:pointer}
.btn-save:hover{opacity:.85}
.btn-del{font-family:'DM Sans',sans-serif;font-size:.8rem;background:none;border:1px solid color-mix(in srgb,var(--severity-crit) 40%,transparent);color:var(--severity-crit);border-radius:9px;padding:.6rem 1rem;cursor:pointer;margin-right:auto}

#cnr-toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--surface);font-size:.8rem;font-weight:500;padding:.65rem 1.3rem;border-radius:30px;opacity:0;transition:all .25s;pointer-events:none;z-index:200;white-space:nowrap}
#cnr-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>


<div class="wrap">

  <div class="kpis" id="kpis">
    <div class="kpi"><div class="kpi-val" id="k-total">—</div><div class="kpi-lbl">Compradores</div></div>
    <div class="kpi"><div class="kpi-val" id="k-lojas">—</div><div class="kpi-lbl">Lojas</div></div>
    <div class="kpi"><div class="kpi-val" id="k-inv">—</div><div class="kpi-lbl">Investidores</div></div>
    <div class="kpi"><div class="kpi-val" id="k-pf">—</div><div class="kpi-lbl">Pessoas físicas</div></div>

  <div class="toolbar">
    <input id="busca" type="text" placeholder="Buscar por nome, cidade ou marca..." oninput="filtrar()">
    <select id="f-tipo" onchange="filtrar()">
      <option value="">Todos os tipos</option>

    <select id="f-papel" onchange="filtrar()">

      <option value="ambos">Ambos</option>

    <select id="f-ordem" onchange="filtrar()">
      <option value="">Ordem A–Z</option>
      <option value="compras">Mais compras</option>

</div>

<!-- Modal -->
<div class="modal-bg" id="modal-bg" onclick="fecharModalFora(event)">
  <div class="modal">
    <div class="modal-titulo" id="modal-titulo">Novo Comprador</div>

    <div class="field">
      <label>Nome fantasia *</label>
      <input id="m-nome" type="text" placeholder="ex: Auto Prime Veículos, Garage Premium">
    </div>
    <div class="field">
      <label>Proprietário</label>
      <input id="m-proprietario" type="text" placeholder="Nome completo do dono / responsável">

    <div class="g2">
      <div class="field">
        <label>Telefone / WhatsApp</label>
        <div style="display:flex;gap:.4rem;align-items:center">

          <button id="btn-agenda" type="button" onclick="escolherContato()" title="Escolher da agenda" style="font-size:1.2rem;line-height:1;padding:.5rem .55rem;border:1px solid var(--line);border-radius:9px;background:var(--surface-raise);cursor:pointer;flex-shrink:0">📇</button>
        </div>
      </div>
      <div class="field">
        <label>Tipo</label>

          <option value="loja">Loja</option>
          <option value="pessoa_fisica">Pessoa física</option>
          <option value="investidor">Investidor</option>
          <option value="revendedor">Revendedor</option>
          <option value="parceiro">Parceiro / Fonte</option>
          <option value="franquia">Franquia (ex: Vaapty)</option>
          <option value="concessionaria">Concessionária</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Papel no negócio</label>
      <select id="m-papel">
        <option value="comprador">Comprador — recebe ofertas de carros</option>
        <option value="fonte">Fonte / Parceiro — nos envia carros para repassar</option>
        <option value="ambos">Ambos — compra e envia carros</option>
      </select>
    </div>
    <div class="field">
      <label>Cidade</label>
      <input id="m-cidade" type="text" placeholder="Florianópolis">

    <div class="field">
      <label>Observações</label>
      <textarea id="m-obs" placeholder="ex: só compra automático, prefere placa par, paga PIX..."></textarea>
    </div>

    <!-- 💡 O que sabemos — conhecimento estruturado -->
    <div id="bloco-conhecimento" style="display:none;border-top:1px solid var(--line);margin-top:.8rem;padding-top:.9rem">
      <div style="font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text-mid);font-weight:700;margin-bottom:.6rem">💡 O que sabemos</div>
      <div id="obs-lista" style="display:flex;flex-direction:column;gap:.35rem;margin-bottom:.6rem"></div>
      <div style="display:flex;gap:.5rem">
        <input id="obs-input" type="text" placeholder='ex: "Só compra Corolla branco"' onkeydown="if(event.key==='Enter'){adicionarObs();event.preventDefault()}" style="flex:1;font-family:'DM Sans',sans-serif;font-size:.85rem;padding:.5rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--surface-raise);color:var(--text)">
        <button onclick="adicionarObs()" style="font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:700;padding:.5rem .9rem;border-radius:8px;border:none;background:var(--text);color:var(--surface);cursor:pointer">+</button>

    <!-- Faturamento PJ -->

    <!-- Endereço (sempre visível) -->

        <div class="field"><label>CEP</label><input id="m-cep" type="text" placeholder="88000-000" inputmode="numeric" oninput="buscarCep(this.value)"></div>

</div>

<div id="cnr-toast"></div>

<script>

const MARCAS = ['Chevrolet','Fiat','Volkswagen','Ford','Toyota','Honda','Hyundai','Jeep',
  'Renault','Nissan','Mitsubishi','Citroën','Peugeot','Kia','BMW','Mercedes-Benz','Audi',
  'Land Rover','Volvo','Subaru','Ram','Dodge'];

let TODOS = [];
let editId = null;
let marcasSel = [];
let HIST_COMP = {}; // id ou nome → { count, taxa, total }

// ── Init ──────────────────────────────────────────────────────────────
async function init() {
  await carregar();
  renderMarcasTags();
  // Oculta o botão 📇 em ambientes sem suporte (desktop, Firefox, Safari iOS)
  if (!('contacts' in navigator && 'ContactsManager' in window)) {
    const b = document.getElementById('btn-agenda');
    if (b) b.style.display = 'none';
  }
}

// ── Escolher contato da agenda para preencher o modal ─────────────────
async function escolherContato() {
  try {
    const lista = await navigator.contacts.select(['name', 'tel'], { multiple: false });
    if (!lista.length) return;
    const c    = lista[0];
    const nome = (c.name?.[0] || '').trim();
    const tel  = (c.tel?.[0]  || '').trim();
    if (nome && !document.getElementById('m-nome').value) {
      document.getElementById('m-nome').value = nome;
    }
    if (tel) document.getElementById('m-tel').value = tel;
  } catch (e) {
    // usuário cancelou — ignora silenciosamente
  }
}

// ── Importar da agenda do celular (Contact Picker API — Android Chrome) ──
async function importarAgenda() {
  if (!('contacts' in navigator && 'ContactsManager' in window)) {
    alert('Disponível apenas no Chrome do Android.\n\nNo computador, use o botão "+ Novo comprador".');
    return;
  }
  try {
    const contatos = await navigator.contacts.select(['name', 'tel'], { multiple: true });
    if (!contatos.length) return;
    let importados = 0;
    let duplicados = 0;
    for (const c of contatos) {
      const nome = c.name?.[0]?.trim();
      const tel  = (c.tel?.[0] || '').trim();
      if (!nome) continue;
      const jaExiste = TODOS.some(t =>
        t.nome.toLowerCase() === nome.toLowerCase() ||
        (tel && t.telefone && t.telefone.replace(/\D/g,'') === tel.replace(/\D/g,''))
      );
      if (jaExiste) { duplicados++; continue; }
      const r = await fetch('/api/compradores', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, telefone: tel, tipo: 'pessoa_fisica' }),
      });
      if (r.ok) importados++;
    }
    let msg = `✓ ${importados} contato${importados !== 1 ? 's' : ''} importado${importados !== 1 ? 's' : ''}`;
    if (duplicados) msg += ` · ${duplicados} já existia${duplicados !== 1 ? 'm' : ''}`;
    toast(msg);
    await carregar();
  } catch (e) {
    // usuário cancelou a seleção — ignora silenciosamente
  }
}

async function carregar() {
  const [rC, rV] = await Promise.all([fetch('/api/compradores'), fetch('/api/vendas')]);
  if (!rC.ok) return;
  TODOS = await rC.json();
  if (rV.ok) {
    const vendas = await rV.json();
    HIST_COMP = {};
    vendas.forEach(v => {
      const keys = [v.comprador_id, v.comprador_nome].filter(Boolean);
      keys.forEach(k => {
        if (!HIST_COMP[k]) HIST_COMP[k] = { count: 0, taxa: 0, total: 0 };
        HIST_COMP[k].count++;
        HIST_COMP[k].taxa  += Number(v.taxa_intermediacao) || 0;
        HIST_COMP[k].total += Number(v.valor_venda) || 0;
      });
    });
  }
  renderKpis();
  filtrar();
}

function renderKpis() {
  document.getElementById('k-total').textContent = TODOS.filter(c => c.ativo).length;
  document.getElementById('k-lojas').textContent = TODOS.filter(c => c.ativo && c.tipo === 'loja').length;
  document.getElementById('k-inv').textContent   = TODOS.filter(c => c.ativo && c.tipo === 'investidor').length;
  document.getElementById('k-pf').textContent    = TODOS.filter(c => c.ativo && c.tipo === 'pessoa_fisica').length;
  const taxaTotal = Object.values(HIST_COMP).reduce((s, h) => s + h.taxa, 0);
  // HIST_COMP tem entradas duplicadas (por id E por nome), então divide por 2 se ambos existem — usa só soma única por id
  const taxaUnica = Object.entries(HIST_COMP)
    .filter(([k]) => k.includes('-')) // UUIDs têm traços
    .reduce((s, [, h]) => s + h.taxa, 0);
  const taxaFinal = taxaUnica > 0 ? taxaUnica : taxaTotal;
  document.getElementById('k-taxa').textContent = taxaFinal > 0
    ? 'R$ ' + Number(taxaFinal).toLocaleString('pt-BR', { maximumFractionDigits: 0 })
    : '—';
}

function filtrar() {
  const q    = document.getElementById('busca').value.toLowerCase();
  const tipo = document.getElementById('f-tipo').value;
  const ord  = document.getElementById('f-ordem').value;
  const papel = document.getElementById('f-papel').value;
  let res = TODOS.filter(c => {
    const txt = `${c.nome} ${c.cidade || ''} ${(c.marcas||[]).join(' ')}`.toLowerCase();
    return (!q || txt.includes(q)) && (!tipo || c.tipo === tipo) && (!papel || (c.papel || 'comprador') === papel);
  });
  if (ord === 'compras') {
    res = [...res].sort((a, b) => {
      const ha = HIST_COMP[a.id] || HIST_COMP[a.nome] || { count: 0 };
      const hb = HIST_COMP[b.id] || HIST_COMP[b.nome] || { count: 0 };
      return hb.count - ha.count;
    });
  } else if (ord === 'taxa') {
    res = [...res].sort((a, b) => {
      const ha = HIST_COMP[a.id] || HIST_COMP[a.nome] || { taxa: 0 };
      const hb = HIST_COMP[b.id] || HIST_COMP[b.nome] || { taxa: 0 };
      return hb.taxa - ha.taxa;
    });
  }
  renderLista(res);
}

function renderLista(lista) {
  const el = document.getElementById('lista');
  const empty = document.getElementById('empty');
  if (!lista.length) { el.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';
  el.innerHTML = lista.map(c => {
    const badge = {loja:'badge-loja',pessoa_fisica:'badge-pf',investidor:'badge-inv',revendedor:'badge-rev'}[c.tipo] || 'badge-rev';
    const label = {loja:'Loja',pessoa_fisica:'Pessoa física',investidor:'Investidor',revendedor:'Revendedor'}[c.tipo] || c.tipo;
    const preco = c.preco_min && c.preco_max
      ? `R$ ${fmt(c.preco_min)} – R$ ${fmt(c.preco_max)}`
      : c.preco_max ? `até R$ ${fmt(c.preco_max)}` : '';
    const marcas = (c.marcas || []).map(m => `<span class="tag">${m}</span>`).join('');
    const wa = c.telefone ? c.telefone.replace(/\D/g,'') : '';
    const h = HIST_COMP[c.id] || HIST_COMP[c.nome] || null;
    const histTxt = h && h.count > 0
      ? `${h.count} compra${h.count>1?'s':''} · R$ ${Number(h.taxa).toLocaleString('pt-BR',{maximumFractionDigits:0})} taxa CNR`
      : '';
    return `<div class="card${c.ativo ? '' : ' inativo'}" onclick="abrirModal('${c.id}')">
      <div class="card-top">
        <div class="card-nome">${c.nome}</div>
        <span class="badge ${badge}">${label}</span>
      </div>
      <div class="card-info">
        ${c.cidade ? `<span>📍 ${c.cidade}</span>` : ''}
        ${c.papel === 'fonte' ? `<span style="font-size:.68rem;color:var(--severity-warn);font-weight:600">📤 Fonte / Parceiro</span>` : ''}
        ${c.papel === 'ambos' ? `<span style="font-size:.68rem;color:var(--severity-ok);font-weight:600">🔄 Compra e envia</span>` : ''}
        ${preco ? `<span class="card-preco">${preco}</span>` : ''}
        ${histTxt ? `<span class="card-hist">✓ ${histTxt}</span>` : ''}
        ${c.observacoes ? `<span style="font-size:.73rem;font-style:italic;color:var(--text-faint)">${c.observacoes.slice(0,80)}${c.observacoes.length>80?'…':''}</span>` : ''}
      </div>
      ${marcas ? `<div class="card-marcas">${marcas}</div>` : ''}
      ${c.ativo ? `<div class="card-acoes" onclick="event.stopPropagation()">
        ${wa ? `<a class="btn-acao verde" href="https://wa.me/55${wa}" target="_blank">💬 WhatsApp</a>` : ''}
        ${wa ? `<a class="btn-acao" href="tel:+55${wa}">📞 Ligar</a>` : ''}
        ${(c.banco || c.pix_chave) ? `<button class="btn-acao" onclick="copiarDadosBancarios('${c.id}')">📋 Banco</button>` : ''}
        <button class="btn-acao" onclick="abrirModal('${c.id}')">✏️ Editar</button>
      </div>` : '<div style="font-size:.68rem;color:var(--text-faint);text-align:center;padding:.3rem 0">Inativo</div>'}
    </div>`;
  }).join('');
}

function parseBRnum(s) {
  if (!s) return null;
  const n = parseFloat(s.replace(/[R$\s]/g,'').replace(/\./g,'').replace(',','.'));
  return isNaN(n) ? null : n;
}

function fmt(n) {
  return Number(n).toLocaleString('pt-BR');
}

// ── Modal ─────────────────────────────────────────────────────────────
function renderMarcasTags() {
  document.getElementById('marcas-wrap').innerHTML = MARCAS.map(m =>
    `<span class="marca-tag" onclick="toggleMarca('${m}')" id="mt-${m.replace(/[^a-z]/gi,'_')}">${m}</span>`
  ).join('');
}

function toggleMarca(m) {
  const idx = marcasSel.indexOf(m);
  if (idx >= 0) marcasSel.splice(idx, 1); else marcasSel.push(m);
  atualizarMarcas();
}

function atualizarMarcas() {
  MARCAS.forEach(m => {
    const el = document.getElementById('mt-' + m.replace(/[^a-z]/gi,'_'));
    if (el) el.classList.toggle('sel', marcasSel.includes(m));
  });
}

function abrirModal(id) {
  editId = id || null;
  marcasSel = [];
  const c = id ? TODOS.find(x => x.id === id) : null;
  document.getElementById('modal-titulo').textContent = c ? 'Editar Comprador' : 'Novo Comprador';
  document.getElementById('m-nome').value          = c?.nome || '';
  document.getElementById('m-proprietario').value  = c?.proprietario || '';
  document.getElementById('m-tel').value            = c?.telefone || '';
  document.getElementById('m-tipo').value           = c?.tipo || 'loja';
  document.getElementById('m-papel').value          = c?.papel || 'comprador';
  document.getElementById('m-cidade').value         = c?.cidade || '';
  document.getElementById('m-pmin').value           = c?.preco_min || '';
  document.getElementById('m-pmax').value           = c?.preco_max || '';
  document.getElementById('m-obs').value            = c?.observacoes || '';
  // PJ
  document.getElementById('m-razao_social').value  = c?.razao_social || '';
  document.getElementById('m-cnpj').value          = c?.cnpj || '';
  document.getElementById('m-ie').value            = c?.ie || '';
  // PF
  document.getElementById('m-cpf').value           = c?.cpf || '';
  document.getElementById('m-rg').value            = c?.rg || '';
  document.getElementById('m-data_nascimento').value = c?.data_nascimento || '';
  // Endereço
  document.getElementById('m-cep').value           = c?.cep || '';
  document.getElementById('m-estado').value        = c?.estado || 'SC';
  document.getElementById('m-logradouro').value    = c?.logradouro || '';
  document.getElementById('m-numero').value        = c?.numero || '';
  document.getElementById('m-complemento_end').value = c?.complemento_end || '';
  document.getElementById('m-bairro').value        = c?.bairro || '';
  document.getElementById('m-cidade2').value       = c?.cidade || '';
  // Banco
  document.getElementById('m-banco').value      = c?.banco || '';
  document.getElementById('m-agencia').value    = c?.agencia || '';
  document.getElementById('m-conta').value      = c?.conta || '';
  document.getElementById('m-tipo_conta').value = c?.tipo_conta || 'corrente';
  document.getElementById('m-pix_tipo').value   = c?.pix_tipo || '';
  document.getElementById('m-pix_chave').value  = c?.pix_chave || '';
  marcasSel = c?.marcas ? [...c.marcas] : [];
  atualizarMarcas();
  atualizarBlocoFat(c?.tipo || 'loja');
  document.getElementById('btn-del').style.display = c ? '' : 'none';
  const blocoObs = document.getElementById('bloco-conhecimento');
  if (c) {
    blocoObs.style.display = '';
    _obsLista = [];
    document.getElementById('obs-lista').innerHTML = '';
    carregarObs(c.id);
  } else {
    blocoObs.style.display = 'none';
  }
  document.getElementById('modal-bg').classList.add('show');
  setTimeout(() => document.getElementById('m-nome').focus(), 50);
}

function fecharModal() {
  document.getElementById('modal-bg').classList.remove('show');
  document.getElementById('bloco-conhecimento').style.display = 'none';
  document.getElementById('obs-lista').innerHTML = '';
  document.getElementById('obs-input').value = '';
  _obsLista = [];
  editId = null;
}

// ── Conhecimento (observações) ─────────────────────────────────
let _obsLista = [];

async function carregarObs(id) {
  const r = await fetch(`/api/compradores?obs=1&entidade_id=${id}&tipo=comprador`);
  if (!r.ok) return;
  _obsLista = await r.json();
  renderObs();
}

function renderObs() {
  const el = document.getElementById('obs-lista');
  if (!_obsLista.length) {
    el.innerHTML = '<div style="font-size:.75rem;color:var(--text-faint);padding:.2rem 0">Nenhum conhecimento registrado ainda.</div>';
    return;
  }
  el.innerHTML = _obsLista.map(o => `
    <div style="display:flex;align-items:flex-start;gap:.5rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.45rem .65rem">
      <span style="flex:1;font-size:.82rem;line-height:1.45">${o.texto}</span>
      <button onclick="arquivarObs('${o.id}')" title="Arquivar" style="background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:.75rem;padding:0;line-height:1;flex-shrink:0">✕</button>
    </div>`).join('');
}

async function adicionarObs() {
  const input = document.getElementById('obs-input');
  const texto = input.value.trim();
  if (!texto || !editId) return;
  const r = await fetch('/api/compradores?obs=1', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ entidade_id: editId, tipo_entidade: 'comprador', texto }),
  });
  if (!r.ok) return;
  const nova = await r.json();
  _obsLista.push(nova);
  input.value = '';
  renderObs();
  input.focus();
}

async function arquivarObs(id) {
  const r = await fetch(`/api/compradores?obs=1&id=${id}`, { method: 'PATCH' });
  if (!r.ok) return;
  _obsLista = _obsLista.filter(o => o.id !== id);
  renderObs();
}

function fecharModalFora(e) {
  if (e.target === document.getElementById('modal-bg')) fecharModal();
}

async function salvar() {
  const nome = document.getElementById('m-nome').value.trim();
  if (!nome) { toast('Informe o nome', true); return; }
  const payload = {
    nome,
    proprietario: document.getElementById('m-proprietario').value.trim() || null,
    papel:       document.getElementById('m-papel').value || 'comprador',
    telefone:    document.getElementById('m-tel').value.trim() || null,
    tipo:        document.getElementById('m-tipo').value,
    cidade:      document.getElementById('m-cidade2').value.trim() || document.getElementById('m-cidade').value.trim() || null,
    preco_min:   parseBRnum(document.getElementById('m-pmin').value),
    preco_max:   parseBRnum(document.getElementById('m-pmax').value),
    marcas:      marcasSel.length ? marcasSel : null,
    observacoes: document.getElementById('m-obs').value.trim() || null,
    // PJ
    razao_social: document.getElementById('m-razao_social').value.trim() || null,
    cnpj:         document.getElementById('m-cnpj').value.trim() || null,
    ie:           document.getElementById('m-ie').value.trim() || null,
    // PF
    cpf:            document.getElementById('m-cpf').value.trim() || null,
    rg:             document.getElementById('m-rg').value.trim() || null,
    data_nascimento: document.getElementById('m-data_nascimento').value || null,
    // Endereço
    cep:            document.getElementById('m-cep').value.trim() || null,
    estado:         document.getElementById('m-estado').value || null,
    logradouro:     document.getElementById('m-logradouro').value.trim() || null,
    numero:         document.getElementById('m-numero').value.trim() || null,
    complemento_end: document.getElementById('m-complemento_end').value.trim() || null,
    bairro:         document.getElementById('m-bairro').value.trim() || null,
    // Banco
    banco:      document.getElementById('m-banco').value.trim() || null,
    agencia:    document.getElementById('m-agencia').value.trim() || null,
    conta:      document.getElementById('m-conta').value.trim() || null,
    tipo_conta: document.getElementById('m-tipo_conta').value || 'corrente',
    pix_tipo:   document.getElementById('m-pix_tipo').value || null,
    pix_chave:  document.getElementById('m-pix_chave').value.trim() || null,
    ativo: true,
  };
  const url    = editId ? `/api/compradores?id=${editId}` : '/api/compradores';
  const method = editId ? 'PATCH' : 'POST';
  const r = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  if (!r.ok) { toast('Erro ao salvar', true); return; }
  toast(editId ? '✓ Comprador atualizado' : '✓ Comprador cadastrado');
  fecharModal();
  await carregar();
}

async function desativar() {
  if (!editId) return;
  if (!confirm('Desativar este comprador?')) return;
  const r = await fetch(`/api/compradores?id=${editId}`, { method: 'DELETE' });
  if (!r.ok) { toast('Erro ao desativar', true); return; }
  toast('Comprador desativado');
  fecharModal();
  await carregar();
}

function toast(msg, err) {
  const el = document.getElementById('cnr-toast');
  el.textContent = msg;
  el.style.background = err ? 'var(--severity-crit)' : 'var(--text)';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });

document.getElementById('m-tipo').addEventListener('change', e => atualizarBlocoFat(e.target.value));

function atualizarBlocoFat(tipo) {
  const isPJ = ['loja','revendedor','parceiro','franquia','concessionaria'].includes(tipo);
  const isPF = tipo === 'pessoa_fisica';
  document.getElementById('bloco-pj').style.display = isPJ ? '' : 'none';
  document.getElementById('bloco-pf').style.display = isPF ? '' : 'none';
}

function cnpjMask(el) {
  let v = el.value.replace(/\D/g,'').slice(0,14);
  if (v.length > 12) v = v.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d+)/,'$1.$2.$3/$4-$5');
  else if (v.length > 8) v = v.replace(/^(\d{2})(\d{3})(\d{3})(\d+)/,'$1.$2.$3/$4');
  else if (v.length > 5) v = v.replace(/^(\d{2})(\d{3})(\d+)/,'$1.$2.$3');
  else if (v.length > 2) v = v.replace(/^(\d{2})(\d+)/,'$1.$2');
  el.value = v;
}

function toTitleCase(str) {
  const prep = new Set(['de','da','do','das','dos','e','em','com','por','a','o','as','os']);
  return str.toLowerCase().replace(/\S+/g, (w, i) =>
    (i === 0 || !prep.has(w)) ? w[0].toUpperCase() + w.slice(1) : w
  );
}

async function buscarCNPJ() {
  const cnpj = document.getElementById('m-cnpj').value.replace(/\D/g,'');
  const st   = document.getElementById('cnpj-st');
  if (cnpj.length !== 14) { st.textContent = 'CNPJ deve ter 14 dígitos.'; return; }
  st.textContent = '⏳ Buscando...';
  try {
    const r = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);
    if (!r.ok) { st.textContent = '✗ CNPJ não encontrado.'; return; }
    const d = await r.json();
    if (d.razao_social) document.getElementById('m-razao_social').value = toTitleCase(d.razao_social);
    if (d.logradouro)   document.getElementById('m-logradouro').value   = toTitleCase(d.logradouro);
    if (d.numero)       document.getElementById('m-numero').value        = d.numero;
    if (d.bairro)       document.getElementById('m-bairro').value       = toTitleCase(d.bairro);
    if (d.municipio) {
      const cidade = toTitleCase(d.municipio);
      document.getElementById('m-cidade2').value = cidade;
      if (!document.getElementById('m-cidade').value)
        document.getElementById('m-cidade').value = cidade;
    }
    if (d.uf)           document.getElementById('m-estado').value       = d.uf;
    if (d.cep)          document.getElementById('m-cep').value          = d.cep.replace(/\D/g,'').replace(/(\d{5})(\d{3})/,'$1-$2');
    if (d.nome_fantasia && !document.getElementById('m-nome').value)
                        document.getElementById('m-nome').value         = toTitleCase(d.nome_fantasia);
    st.textContent = '✓ Dados preenchidos automaticamente.';
  } catch(_) { st.textContent = '✗ Erro ao buscar. Tente novamente.'; }
}

function copiarDadosBancarios(id) {
  const c = TODOS.find(x => x.id === id);
  if (!c) return;
  const lines = [`Dados bancários — ${c.nome}`, ''];
  if (c.banco) {
    lines.push(`Banco: ${c.banco}`);
    const tipo = c.tipo_conta === 'poupanca' ? 'Poupança' : 'Corrente';
    const parts = [c.agencia && `Ag: ${c.agencia}`, c.conta && `Conta: ${c.conta} (${tipo})`].filter(Boolean);
    if (parts.length) lines.push(parts.join(' / '));
  }
  if (c.pix_chave) {
    const tipoMap = {cpf:'CPF',cnpj:'CNPJ',email:'E-mail',telefone:'Telefone',aleatoria:'Aleatória'};
    const label = c.pix_tipo ? ` (${tipoMap[c.pix_tipo] || c.pix_tipo})` : '';
    lines.push(`Pix: ${c.pix_chave}${label}`);
  }
  lines.push('');
  if (c.razao_social) lines.push(`Razão social: ${c.razao_social}`);
  else lines.push(`Nome: ${c.proprietario || c.nome}`);
  if (c.cnpj) lines.push(`CNPJ: ${c.cnpj}`);
  else if (c.cpf) lines.push(`CPF: ${c.cpf}`);
  navigator.clipboard.writeText(lines.join('\n'))
    .then(() => toast('📋 Dados bancários copiados!'))
    .catch(() => toast('Erro ao copiar', true));
}

async function buscarCep(cep) {
  const limpo = cep.replace(/\D/g,'');
  if (limpo.length !== 8) return;
  try {
    const r = await fetch(`/api/utils?type=cep&cep=${limpo}`);
    if (!r.ok) return;
    const d = await r.json();
    if (d.logradouro) document.getElementById('m-logradouro').value = d.logradouro;
    if (d.bairro)     document.getElementById('m-bairro').value     = d.bairro;
    if (d.cidade)     document.getElementById('m-cidade2').value    = d.cidade;
    if (d.estado)     document.getElementById('m-estado').value     = d.estado;
  } catch(_) {}
}

init().then(() => {
  // Deep-link: vindo da busca global com ?id=
  const _pId = new URLSearchParams(location.search).get('id');
  if (_pId) {
    history.replaceState({}, '', '/compradores.html');
    abrirModal(_pId);
  }
});
