<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Compradores — Carro na Rede</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
<link rel="apple-touch-icon" href="/assets/icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/tokens.css">
<script src="/assets/theme-toggle.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text);min-height:100vh;padding-bottom:3rem}

header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.7rem;padding:1.1rem 1.4rem;border-bottom:1px solid var(--line)}
.logo{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700}
.logo span{display:block;font-size:.55rem;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--text-mid);margin-top:.1rem}
.nav{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.nav a{font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-mid);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:.38rem .7rem;transition:color .15s,border-color .15s}
.nav a:hover,.nav a.ativo{color:var(--text);border-color:var(--text)}
.nav button{font-size:.9rem;background:none;border:1px solid var(--line);border-radius:7px;color:var(--text-mid);padding:.38rem .6rem;cursor:pointer;line-height:1}

.wrap{max-width:900px;margin:0 auto;padding:1.4rem 1.2rem}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem;margin-bottom:1.4rem}
.kpi{background:var(--surface-raise);border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem}
.kpi-val{font-size:1.6rem;font-weight:700;font-family:'Playfair Display',serif;line-height:1}
.kpi-lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-mid);margin-top:.3rem}

/* Toolbar */
.toolbar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:1.1rem}
.toolbar input{flex:1;min-width:180px;font-family:'DM Sans',sans-serif;font-size:.88rem;padding:.55rem .8rem;border:1px solid var(--line);border-radius:9px;background:var(--surface-raise);color:var(--text)}
.toolbar input:focus{outline:none;border-color:var(--accent)}
.toolbar select{font-family:'DM Sans',sans-serif;font-size:.82rem;padding:.55rem .7rem;border:1px solid var(--line);border-radius:9px;background:var(--surface-raise);color:var(--text);cursor:pointer}
.btn-add{font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:var(--text);color:var(--surface);border:none;border-radius:9px;padding:.6rem 1.1rem;cursor:pointer;white-space:nowrap}
.btn-add:hover{opacity:.85}

/* Lista */
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.8rem}
.card{background:var(--surface-raise);border:1px solid var(--line);border-radius:12px;padding:1rem;display:flex;flex-direction:column;gap:.5rem;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem}
.card-nome{font-weight:700;font-size:.95rem;line-height:1.2}
.badge{font-size:.6rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .5rem;border-radius:20px;white-space:nowrap}
.badge-loja{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.badge-pf{background:color-mix(in srgb,var(--severity-ok) 15%,transparent);color:var(--severity-ok)}
.badge-inv{background:color-mix(in srgb,var(--severity-warn) 15%,transparent);color:var(--severity-warn)}
.badge-rev{background:color-mix(in srgb,var(--text-mid) 20%,transparent);color:var(--text-mid)}
.card-info{font-size:.78rem;color:var(--text-mid);display:flex;flex-direction:column;gap:.2rem}
.card-preco{font-size:.82rem;font-weight:600;color:var(--text)}
.card-marcas{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.2rem}
.tag{font-size:.62rem;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:.15rem .4rem;color:var(--text-mid)}
.card-acoes{display:flex;gap:.5rem;margin-top:.3rem;border-top:1px solid var(--line);padding-top:.6rem}
.btn-acao{flex:1;font-family:'DM Sans',sans-serif;font-size:.7rem;font-weight:600;padding:.45rem;border-radius:7px;border:1px solid var(--line);background:none;color:var(--text-mid);cursor:pointer;transition:all .15s;text-decoration:none;text-align:center}
.btn-acao:hover{border-color:var(--text);color:var(--text)}
.btn-acao.verde{border-color:color-mix(in srgb,var(--severity-ok) 40%,transparent);color:var(--severity-ok)}
.btn-acao.verde:hover{background:color-mix(in srgb,var(--severity-ok) 10%,transparent)}
.inativo{opacity:.45}

/* Empty */
.empty{text-align:center;padding:3rem 1rem;color:var(--text-faint)}
.empty-ico{font-size:2.5rem;margin-bottom:.5rem}
.empty-txt{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:flex-start;justify-content:center;overflow-y:auto;padding:1.5rem 1rem}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:520px;padding:1.5rem;margin:auto}
.modal-titulo{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;margin-bottom:1.2rem}
.field{margin-bottom:.9rem}
.field label{display:block;font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-mid);font-weight:600;margin-bottom:.35rem}
.field input,.field select,.field textarea{width:100%;font-family:'DM Sans',sans-serif;font-size:.9rem;padding:.6rem .75rem;border:1px solid var(--line);border-radius:9px;background:var(--surface-raise);color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field textarea{resize:vertical;min-height:70px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.marcas-wrap{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.4rem}
.marca-tag{font-size:.72rem;background:var(--surface-raise);border:1px solid var(--line);border-radius:6px;padding:.25rem .5rem;cursor:pointer;transition:all .15s}
.marca-tag.sel{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.modal-footer{display:flex;gap:.7rem;justify-content:flex-end;margin-top:1.2rem;padding-top:1rem;border-top:1px solid var(--line)}
.btn-cancel{font-family:'DM Sans',sans-serif;font-size:.8rem;background:none;border:1px solid var(--line);border-radius:9px;padding:.6rem 1.1rem;cursor:pointer;color:var(--text-mid)}
.btn-save{font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:600;background:var(--text);color:var(--surface);border:none;border-radius:9px;padding:.6rem 1.4rem;cursor:pointer}
.btn-save:hover{opacity:.85}
.btn-del{font-family:'DM Sans',sans-serif;font-size:.8rem;background:none;border:1px solid color-mix(in srgb,var(--severity-crit) 40%,transparent);color:var(--severity-crit);border-radius:9px;padding:.6rem 1rem;cursor:pointer;margin-right:auto}

#cnr-toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--surface);font-size:.8rem;font-weight:500;padding:.65rem 1.3rem;border-radius:30px;opacity:0;transition:all .25s;pointer-events:none;z-index:200;white-space:nowrap}
#cnr-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="logo">Carro na Rede <span>CRM de Compradores</span></div>
  <div class="nav">
    <a href="/home.html">🏠 Painel</a>
    <a href="/index.html">📝 Gerador</a>
    <a href="/catalogo.html">📂 Catálogo</a>
    <a href="/vendas.html">📋 Vendas</a>
    <a href="/compradores.html" class="ativo">👥 Compradores</a>
    <button type="button" id="cnr-theme-btn" onclick="cnrToggleTheme()" title="Alternar tema"></button>
  </div>
</header>

<div class="wrap">

  <div class="kpis" id="kpis">
    <div class="kpi"><div class="kpi-val" id="k-total">—</div><div class="kpi-lbl">Compradores</div></div>
    <div class="kpi"><div class="kpi-val" id="k-lojas">—</div><div class="kpi-lbl">Lojas</div></div>
    <div class="kpi"><div class="kpi-val" id="k-inv">—</div><div class="kpi-lbl">Investidores</div></div>
    <div class="kpi"><div class="kpi-val" id="k-pf">—</div><div class="kpi-lbl">Pessoas físicas</div></div>
  </div>

  <div class="toolbar">
    <input id="busca" type="text" placeholder="Buscar por nome, cidade ou marca..." oninput="filtrar()">
    <select id="f-tipo" onchange="filtrar()">
      <option value="">Todos os tipos</option>
      <option value="loja">Lojas</option>
      <option value="investidor">Investidores</option>
      <option value="pessoa_fisica">Pessoa física</option>
      <option value="revendedor">Revendedores</option>
    </select>
    <button class="btn-add" onclick="abrirModal()">+ Novo comprador</button>
  </div>

  <div class="lista" id="lista"></div>
  <div id="empty" class="empty" style="display:none">
    <div class="empty-ico">👥</div>
    <div class="empty-txt">Nenhum comprador cadastrado</div>
  </div>

</div>

<!-- Modal -->
<div class="modal-bg" id="modal-bg" onclick="fecharModalFora(event)">
  <div class="modal">
    <div class="modal-titulo" id="modal-titulo">Novo Comprador</div>

    <div class="field">
      <label>Nome / Empresa *</label>
      <input id="m-nome" type="text" placeholder="João Veículos">
    </div>
    <div class="g2">
      <div class="field">
        <label>Telefone / WhatsApp</label>
        <input id="m-tel" type="tel" placeholder="(48) 99999-9999">
      </div>
      <div class="field">
        <label>Tipo</label>
        <select id="m-tipo">
          <option value="loja">Loja</option>
          <option value="pessoa_fisica">Pessoa física</option>
          <option value="investidor">Investidor</option>
          <option value="revendedor">Revendedor</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Cidade</label>
      <input id="m-cidade" type="text" placeholder="Florianópolis">
    </div>
    <div class="g2">
      <div class="field">
        <label>Preço mínimo (R$)</label>
        <input id="m-pmin" type="number" placeholder="30000">
      </div>
      <div class="field">
        <label>Preço máximo (R$)</label>
        <input id="m-pmax" type="number" placeholder="120000">
      </div>
    </div>
    <div class="field">
      <label>Marcas de interesse — clique para selecionar</label>
      <div class="marcas-wrap" id="marcas-wrap"></div>
    </div>
    <div class="field">
      <label>Observações</label>
      <textarea id="m-obs" placeholder="ex: só compra automático, prefere placa par, paga PIX..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-del" id="btn-del" style="display:none" onclick="desativar()">Desativar</button>
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-save" onclick="salvar()">Salvar</button>
    </div>
  </div>
</div>

<div id="cnr-toast"></div>

<script>
document.getElementById('cnr-theme-btn').textContent = cnrThemeIcon();

const MARCAS = ['Chevrolet','Fiat','Volkswagen','Ford','Toyota','Honda','Hyundai','Jeep',
  'Renault','Nissan','Mitsubishi','Citroën','Peugeot','Kia','BMW','Mercedes-Benz','Audi',
  'Land Rover','Volvo','Subaru','Ram','Dodge'];

let TODOS = [];
let editId = null;
let marcasSel = [];

// ── Init ──────────────────────────────────────────────────────────────
async function init() {
  await carregar();
  renderMarcasTags();
}

async function carregar() {
  const r = await fetch('/api/compradores');
  if (!r.ok) return;
  TODOS = await r.json();
  renderKpis();
  filtrar();
}

function renderKpis() {
  document.getElementById('k-total').textContent = TODOS.filter(c => c.ativo).length;
  document.getElementById('k-lojas').textContent = TODOS.filter(c => c.ativo && c.tipo === 'loja').length;
  document.getElementById('k-inv').textContent   = TODOS.filter(c => c.ativo && c.tipo === 'investidor').length;
  document.getElementById('k-pf').textContent    = TODOS.filter(c => c.ativo && c.tipo === 'pessoa_fisica').length;
}

function filtrar() {
  const q   = document.getElementById('busca').value.toLowerCase();
  const tipo = document.getElementById('f-tipo').value;
  const res = TODOS.filter(c => {
    const txt = `${c.nome} ${c.cidade || ''} ${(c.marcas||[]).join(' ')}`.toLowerCase();
    return (!q || txt.includes(q)) && (!tipo || c.tipo === tipo);
  });
  renderLista(res);
}

function renderLista(lista) {
  const el = document.getElementById('lista');
  const empty = document.getElementById('empty');
  if (!lista.length) { el.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';
  el.innerHTML = lista.map(c => {
    const badge = {loja:'badge-loja',pessoa_fisica:'badge-pf',investidor:'badge-inv',revendedor:'badge-rev'}[c.tipo] || 'badge-rev';
    const label = {loja:'Loja',pessoa_fisica:'Pessoa física',investidor:'Investidor',revendedor:'Revendedor'}[c.tipo] || c.tipo;
    const preco = c.preco_min && c.preco_max
      ? `R$ ${fmt(c.preco_min)} – R$ ${fmt(c.preco_max)}`
      : c.preco_max ? `até R$ ${fmt(c.preco_max)}` : '';
    const marcas = (c.marcas || []).map(m => `<span class="tag">${m}</span>`).join('');
    const wa = c.telefone ? c.telefone.replace(/\D/g,'') : '';
    return `<div class="card${c.ativo ? '' : ' inativo'}" onclick="abrirModal('${c.id}')">
      <div class="card-top">
        <div class="card-nome">${c.nome}</div>
        <span class="badge ${badge}">${label}</span>
      </div>
      <div class="card-info">
        ${c.cidade ? `<span>📍 ${c.cidade}</span>` : ''}
        ${preco ? `<span class="card-preco">${preco}</span>` : ''}
        ${c.observacoes ? `<span style="font-size:.73rem;font-style:italic;color:var(--text-faint)">${c.observacoes.slice(0,80)}${c.observacoes.length>80?'…':''}</span>` : ''}
      </div>
      ${marcas ? `<div class="card-marcas">${marcas}</div>` : ''}
      ${c.ativo ? `<div class="card-acoes" onclick="event.stopPropagation()">
        ${wa ? `<a class="btn-acao verde" href="https://wa.me/55${wa}" target="_blank">💬 WhatsApp</a>` : ''}
        ${wa ? `<a class="btn-acao" href="tel:+55${wa}">📞 Ligar</a>` : ''}
        <button class="btn-acao" onclick="abrirModal('${c.id}')">✏️ Editar</button>
      </div>` : '<div style="font-size:.68rem;color:var(--text-faint);text-align:center;padding:.3rem 0">Inativo</div>'}
    </div>`;
  }).join('');
}

function fmt(n) {
  return Number(n).toLocaleString('pt-BR');
}

// ── Modal ─────────────────────────────────────────────────────────────
function renderMarcasTags() {
  document.getElementById('marcas-wrap').innerHTML = MARCAS.map(m =>
    `<span class="marca-tag" onclick="toggleMarca('${m}')" id="mt-${m.replace(/[^a-z]/gi,'_')}">${m}</span>`
  ).join('');
}

function toggleMarca(m) {
  const idx = marcasSel.indexOf(m);
  if (idx >= 0) marcasSel.splice(idx, 1); else marcasSel.push(m);
  atualizarMarcas();
}

function atualizarMarcas() {
  MARCAS.forEach(m => {
    const el = document.getElementById('mt-' + m.replace(/[^a-z]/gi,'_'));
    if (el) el.classList.toggle('sel', marcasSel.includes(m));
  });
}

function abrirModal(id) {
  editId = id || null;
  marcasSel = [];
  const c = id ? TODOS.find(x => x.id === id) : null;
  document.getElementById('modal-titulo').textContent = c ? 'Editar Comprador' : 'Novo Comprador';
  document.getElementById('m-nome').value   = c?.nome || '';
  document.getElementById('m-tel').value    = c?.telefone || '';
  document.getElementById('m-tipo').value   = c?.tipo || 'loja';
  document.getElementById('m-cidade').value = c?.cidade || '';
  document.getElementById('m-pmin').value   = c?.preco_min || '';
  document.getElementById('m-pmax').value   = c?.preco_max || '';
  document.getElementById('m-obs').value    = c?.observacoes || '';
  marcasSel = c?.marcas ? [...c.marcas] : [];
  atualizarMarcas();
  document.getElementById('btn-del').style.display = c ? '' : 'none';
  document.getElementById('modal-bg').classList.add('show');
  setTimeout(() => document.getElementById('m-nome').focus(), 50);
}

function fecharModal() {
  document.getElementById('modal-bg').classList.remove('show');
  editId = null;
}

function fecharModalFora(e) {
  if (e.target === document.getElementById('modal-bg')) fecharModal();
}

async function salvar() {
  const nome = document.getElementById('m-nome').value.trim();
  if (!nome) { toast('Informe o nome', true); return; }
  const payload = {
    nome,
    telefone: document.getElementById('m-tel').value.trim() || null,
    tipo:     document.getElementById('m-tipo').value,
    cidade:   document.getElementById('m-cidade').value.trim() || null,
    preco_min: document.getElementById('m-pmin').value || null,
    preco_max: document.getElementById('m-pmax').value || null,
    marcas:   marcasSel.length ? marcasSel : null,
    observacoes: document.getElementById('m-obs').value.trim() || null,
    ativo: true,
  };
  const url    = editId ? `/api/compradores?id=${editId}` : '/api/compradores';
  const method = editId ? 'PATCH' : 'POST';
  const r = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  if (!r.ok) { toast('Erro ao salvar', true); return; }
  toast(editId ? '✓ Comprador atualizado' : '✓ Comprador cadastrado');
  fecharModal();
  await carregar();
}

async function desativar() {
  if (!editId) return;
  if (!confirm('Desativar este comprador?')) return;
  const r = await fetch(`/api/compradores?id=${editId}`, { method: 'DELETE' });
  if (!r.ok) { toast('Erro ao desativar', true); return; }
  toast('Comprador desativado');
  fecharModal();
  await carregar();
}

function toast(msg, err) {
  const el = document.getElementById('cnr-toast');
  el.textContent = msg;
  el.style.background = err ? 'var(--severity-crit)' : 'var(--text)';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });

init();
</script>
</body>
</html>
