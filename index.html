<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carro na Rede Repasses</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">

<!--
  Até 08/set/2026 este arquivo era o Gerador inteiro: uma tela só, com as
  abas Captação e Parceiros por dentro. Ele virou duas telas — /captacao.html
  e /parceiros.html — por decisão do Yuri na entrevista de 07/set, tomada
  pelo dia a dia dele e não por arquitetura.

  Aqui ficou o redirecionamento porque `gerador-cnr.vercel.app` sem caminho
  nenhum já ia para o Painel (vercel.json), e o favorito dele aponta para cá.
  Endereço que ele digitou uma vez continua funcionando.

  O Gerador antigo segue inteiro em /gerador-antigo.html, sem link em lugar
  nenhum. É porta de emergência das primeiras semanas: se as telas novas
  falharem num sábado à noite, existe para onde voltar. Some quando as duas
  novas tiverem rodado alguns carros de verdade.

  O redirecionamento é feito de dois jeitos de propósito: o `meta refresh`
  funciona mesmo com JavaScript desligado, e o `location.replace` age antes
  dele e não deixa entrada no histórico — sem isso, o botão Voltar do celular
  cairia aqui e ricochetearia para o Painel outra vez.
-->
<meta http-equiv="refresh" content="0; url=/home.html">
<script>location.replace('/home.html');</script>

<style>
  html { background: #0a0a0a; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0a0a0a; color: #a3a3a3;
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    font-size: .85rem; text-align: center; padding: 2rem;
  }
  a { color: #f5f5f5; }
</style>
</head>
<body>
  <!-- Só aparece se o redirecionamento não acontecer. Nunca deixar a tela em
       branco: página vazia parece defeito, e ele não teria como saber para
       onde ir. -->
  <div>
    Abrindo o Painel…<br><br>
    <a href="/home.html">Ir para o Painel</a> ·
    <a href="/parceiros.html">Parceiros</a> ·
    <a href="/captacao.html">Captação</a>
  </div>
</body>
</html>
