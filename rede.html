/* ══ ANEXO: ESCOLHER, COMPRIMIR, SUBIR ══════════════════════════════
 *
 * [YURI: "quero o chat do gerador, igual ao whatsapp, com campo de anexo
 * de arquivos e tal, tu sabe que temos muita troca de arquivo"]
 *
 * O caminho de uma foto, do toque ao balão:
 *
 *   escolhe → comprime AQUI → sobe DIRETO para o Supabase → entra na fila
 *   → manda a mensagem, que só carrega o caminho do arquivo
 *
 * Comprimir antes de subir é o que decide o custo do produto inteiro:
 * 3–5 MB viram ~250 KB, e numa transmissão para 50 lojas cada KB vale 50
 * vezes. O porquê está em `assets/comprimir.js`.
 *
 * O arquivo sobe ANTES de a mensagem ser mandada, de propósito: assim a
 * demora do upload acontece enquanto a pessoa ainda está escrevendo, e o
 * ➤ é instantâneo — que é como o WhatsApp parece rápido.
 */
let ANEXOS = [];        // [{ caminho, tipo, bytes, nome, w, h, estado, local }]
const ANEXO_MAX = 10;

function anexoPodeAqui() {
  // Só onde existe conversa ou lista: no "Chegou para mim" não se manda.
  return aberto && (aberto.tipo === 'conversa' || aberto.tipo === 'todos'
    || aberto.tipo === 'lista' || aberto.tipo === 'grupo');
}

async function escolherArquivos(files) {
  const lista = [...(files || [])].slice(0, ANEXO_MAX - ANEXOS.length);
  for (const file of lista) {
    const item = { nome: file.name || 'foto.jpg', estado: 'preparando', bytes: file.size };
    ANEXOS.push(item);
    desenharFila();
    try {
      const { blob, tipo, bytes, w, h } = await window.CNR_COMPRIMIR.comprimir(file);
      // A prévia sai do arquivo que está no aparelho, não do servidor: ela
      // aparece na hora e não custa nenhuma viagem.
      item.local = URL.createObjectURL(blob);
      Object.assign(item, { tipo, bytes, w, h, estado: 'subindo' });
      desenharFila();

      const r = await rede('anexo', { body: { tipo, bytes } });
      const envio = await fetch(r.uploadUrl, {
        method: 'PUT', headers: { 'Content-Type': tipo }, body: blob,
      });
      if (!envio.ok) throw new Error(`HTTP ${envio.status}`);
      item.caminho = r.caminho;
      item.estado = 'pronto';
    } catch (e) {
      item.estado = 'falhou';
      item.erro = (e && e.corpo && e.corpo.error) || e.message;
    }
    desenharFila();
  }
}

function tirarAnexo(i) {
  const a = ANEXOS[i];
  if (a && a.local) URL.revokeObjectURL(a.local);
  ANEXOS.splice(i, 1);
  desenharFila();
}

function limparAnexos() {
  // Sair da conversa no meio de uma gravação descarta o áudio e SOLTA o
  // microfone. Sem isto a bolinha de "gravando" ficaria acesa no aparelho
  // depois de a pessoa já estar em outra tela — e o app pareceria estar
  // escutando às escondidas.
  if (typeof GRAVANDO !== 'undefined' && GRAVANDO) pararGravacao(false);
  ANEXOS.forEach((a) => { if (a.local) URL.revokeObjectURL(a.local); });
  ANEXOS = [];
  desenharFila();
}

function desenharFila() {
  const el = $('anexos-fila');
  if (!el) return;
  el.hidden = !ANEXOS.length;
  el.innerHTML = ANEXOS.map((a, i) => `
    <div class="anexo-mini ${a.estado}">
      ${a.local && /^image\//.test(a.tipo || '')
        ? `<img src="${a.local}" alt="">`
        : `<span class="ico">${/^audio\//.test(a.tipo || '') ? '🎤' : '📄'}</span>`}
      ${a.segundos ? `<span class="dur">${a.segundos}s</span>` : ''}
      <span class="estado">${
        a.estado === 'preparando' ? '…' :
        a.estado === 'subindo' ? '↑' :
        a.estado === 'falhou' ? '!' : ''}</span>
      <button class="x" onclick="tirarAnexo(${i})" title="Tirar">✕</button>
    </div>`).join('')
    + (ANEXOS.some((a) => a.estado === 'falhou')
      ? `<div class="anexo-erro">${esc(ANEXOS.find((a) => a.estado === 'falhou').erro || 'não consegui subir')}</div>`
      : '');
}

/* ── O espaço, por extenso ───────────────────────────────────────
 *
 * Diz de onde vem cada pedaço, porque "está acabando" sem dizer o quê
 * não permite decidir nada. As fotos dos carros e os anexos da conversa
 * dividem o MESMO 1 GB do plano grátis — foi por isso que o medidor
 * passou a contar os dois, em vez de só os anexos e mostrar "0 de 1 GB"
 * com 59 MB já ocupados.
 */
function verEspaco() {
  if (!ESPACO) return;
  const pct = Math.round((ESPACO.total / ESPACO.teto) * 100);
  $('dlg-corpo').innerHTML = `<h3>Espaço</h3>
    <p style="font-size:.85rem;color:var(--text-mid);line-height:1.55;margin-bottom:.8rem">
      <strong>${mb(ESPACO.total)}</strong> de ${mb(ESPACO.teto)} — ${pct}%.</p>
    <div class="op"><span>🚗 Fotos de carro</span><span>${mb(ESPACO.fotos)}</span></div>
    <div class="op"><span>💬 Anexos de conversa</span><span>${mb(ESPACO.anexos)}</span></div>
    <div class="op"><span style="color:var(--text-mid)">dos quais são meus</span>
      <span style="color:var(--text-mid)">${mb(ESPACO.meus)}</span></div>
    <p style="font-size:.8rem;color:var(--text-faint);line-height:1.5;margin-top:.8rem">
      Os dois dividem o mesmo espaço do plano. Nada é apagado sozinho —
      quando apertar, a gente decide o que sai.</p>
    <div class="op" style="justify-content:flex-end"><button onclick="dlg.close()">Fechar</button></div>`;
  $('dlg').showModal();
}

/* ══ GRAVAR ÁUDIO ═══════════════════════════════════════════════════
 *
 * [YURI: "quero o chat do gerador, igual ao whatsapp, com campo de anexo
 * de arquivos e tal"] — e, no meio dele, muita troca de áudio.
 *
 * ── O FORMATO É O PROBLEMA, NÃO A GRAVAÇÃO ───────────────────────
 *
 * O `MediaRecorder` existe nos dois, e grava em formatos DIFERENTES:
 * Android/Chrome em `audio/webm` (Opus) e iPhone/Safari em `audio/mp4`
 * (AAC). Não há um formato que os dois gravem. Então aqui se **pergunta**
 * ao navegador o que ele sabe gravar, em ordem de preferência, em vez de
 * escolher um e torcer.
 *
 * O balde aceita os dois (`rede-anexos.sql`), e quem recebe toca pelo
 * próprio navegador — que sabe ler os dois mesmo não sabendo gravar os
 * dois.
 *
 * ── O "codecs=" TEM DE SAIR ──────────────────────────────────────
 *
 * O gravador devolve `audio/webm;codecs=opus`. O servidor e o balde
 * comparam o tipo por igualdade exata, então o parâmetro faria o envio
 * ser recusado com "esse tipo de arquivo não entra" — por um pedaço de
 * texto, não pelo formato.
 */
const FORMATOS_AUDIO = [
  'audio/webm;codecs=opus',   // Android, Chrome, Edge — o mais leve
  'audio/webm',
  'audio/mp4',                // iPhone/Safari
  'audio/ogg;codecs=opus',
  'audio/mpeg',
];
const TETO_AUDIO_SEG = 300;   // 5 minutos: recado, não podcast

let GRAVADOR = null;
let GRAVANDO = null;   // { pedacos, tipo, comecou, relogio, fluxo }

function formatoDeAudio() {
  if (typeof MediaRecorder === 'undefined') return null;
  return FORMATOS_AUDIO.find((f) => {
    try { return MediaRecorder.isTypeSupported(f); } catch (e) { return false; }
  }) || null;
}

// `audio/webm;codecs=opus` → `audio/webm`. Ver o porquê acima.
const tipoLimpo = (t) => String(t || '').split(';')[0].trim();

function podeGravar() {
  return Boolean(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
    && Boolean(formatoDeAudio());
}

async function gravarAudio() {
  if (GRAVANDO) return pararGravacao(true);
  if (!podeGravar()) {
    return alert('Este aparelho não grava áudio pelo navegador.\n\n'
      + 'No iPhone, funciona com o app na tela de início: Safari → Compartilhar → Adicionar à Tela de Início.');
  }
  if (ANEXOS.length >= ANEXO_MAX) return alert(`No máximo ${ANEXO_MAX} arquivos por mensagem.`);

  let fluxo;
  try {
    fluxo = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    // Cada motivo com a sua frase: "não deu" faz a pessoa tentar de novo
    // esperando outro resultado.
    return alert(e && e.name === 'NotAllowedError'
      ? 'Sem permissão para o microfone.\n\nLibere nas configurações do navegador para este site.'
      : e && e.name === 'NotFoundError'
        ? 'Não encontrei microfone neste aparelho.'
        : 'Não consegui abrir o microfone: ' + (e && e.message));
  }

  const tipo = formatoDeAudio();
  GRAVADOR = new MediaRecorder(fluxo, { mimeType: tipo });
  GRAVANDO = { pedacos: [], tipo, comecou: Date.now(), fluxo };
  GRAVADOR.ondataavailable = (ev) => { if (ev.data && ev.data.size) GRAVANDO.pedacos.push(ev.data); };
  GRAVADOR.onstop = fecharGravacao;
  GRAVADOR.start();

  // O relógio e o teto. Sem teto, um toque esquecido grava até a memória
  // acabar — e o teto de 8 MB por arquivo chegaria antes, cortando o
  // áudio sem avisar.
  GRAVANDO.relogio = setInterval(() => {
    const seg = Math.floor((Date.now() - GRAVANDO.comecou) / 1000);
    if (seg >= TETO_AUDIO_SEG) return pararGravacao(true);
    desenharGravacao(seg);
  }, 250);
  desenharGravacao(0);
}

function pararGravacao(usar) {
  if (!GRAVANDO) return;
  GRAVANDO.usar = usar;
  clearInterval(GRAVANDO.relogio);
  try { GRAVADOR.stop(); } catch (e) { fecharGravacao(); }
}

function fecharGravacao() {
  const g = GRAVANDO;
  GRAVANDO = null; GRAVADOR = null;
  if (!g) return;
  // Soltar o microfone é obrigatório: sem isto a bolinha de "gravando"
  // fica acesa no aparelho depois de terminar, e a pessoa acha que o app
  // continua escutando.
  try { g.fluxo.getTracks().forEach((t) => t.stop()); } catch (e) { /* já solto */ }
  desenharGravacao(null);
  if (!g.usar || !g.pedacos.length) return;

  const seg = Math.round((Date.now() - g.comecou) / 1000);
  // Áudio de menos de 1s é toque sem querer, não recado.
  if (seg < 1) return;
  const blob = new Blob(g.pedacos, { type: g.tipo });
  const tipo = tipoLimpo(g.tipo);
  const item = {
    nome: `audio-${seg}s.${tipo.split('/')[1] || 'webm'}`,
    tipo, bytes: blob.size, estado: 'subindo', segundos: seg,
  };
  ANEXOS.push(item);
  desenharFila();
  subirBlob(item, blob, tipo);
}

// Subir o que já é Blob — o áudio não passa pelo compressor (já vem
// comprimido do gravador) e por isso tem o caminho próprio.
async function subirBlob(item, blob, tipo) {
  try {
    const r = await rede('anexo', { body: { tipo, bytes: blob.size } });
    const envio = await fetch(r.uploadUrl, {
      method: 'PUT', headers: { 'Content-Type': tipo }, body: blob,
    });
    if (!envio.ok) throw new Error(`HTTP ${envio.status}`);
    item.caminho = r.caminho;
    item.estado = 'pronto';
  } catch (e) {
    item.estado = 'falhou';
    item.erro = (e && e.corpo && e.corpo.error) || e.message;
  }
  desenharFila();
}

// A barra de gravação, no lugar do campo de escrever.
function desenharGravacao(seg) {
  const barra = $('gravando');
  if (!barra) return;
  barra.hidden = seg === null;
  $('escrever').hidden = seg !== null;
  if (seg === null) return;
  const m = String(Math.floor(seg / 60)).padStart(2, '0');
  const s = String(seg % 60).padStart(2, '0');
  $('grav-tempo').textContent = `${m}:${s}`;
  // Aviso quando falta pouco: o corte aos 5 minutos não pode ser surpresa.
  $('grav-aviso').textContent = seg > TETO_AUDIO_SEG - 30
    ? `para em ${TETO_AUDIO_SEG - seg}s` : '';
}

/* ── Ver o anexo de uma mensagem ─────────────────────────────────
 *
 * O caminho não é uma URL: é um nome. A URL vem assinada do servidor,
 * depois de ele conferir que esta loja pode ver aquela mensagem.
 *
 * Guardada em memória porque a assinatura vale 2h — pedir de novo a cada
 * desenho da conversa seria uma viagem por foto, toda vez que a tela
 * redesenha, e a conversa redesenha bastante.
 */
const URL_ANEXO = new Map();

async function urlDoAnexo(caminho) {
  if (URL_ANEXO.has(caminho)) return URL_ANEXO.get(caminho);
  const p = rede('anexo', { q: `&caminho=${encodeURIComponent(caminho)}` })
    .then((r) => r.url)
    .catch(() => null);
  URL_ANEXO.set(caminho, p);
  return p;
}

// Depois de a conversa ser desenhada, cada foto busca a própria URL. Sai
// do desenho de propósito: o balão aparece na hora, com o espaço já
// reservado pelo tamanho que veio gravado, e a imagem entra quando chega.
async function carregarAnexos() {
  const alvos = document.querySelectorAll('img[data-anexo]:not([src])');
  for (const img of alvos) {
    const u = await urlDoAnexo(img.dataset.anexo);
    if (u) img.src = u; else img.replaceWith(Object.assign(document.createElement('div'),
      { className: 'anexo-sumiu', textContent: 'arquivo indisponível' }));
  }
  // O áudio também. Eu desenhava o `<audio>` e nunca lhe dava a URL —
  // áudio recebido simplesmente não tocava, sem erro nenhum na tela.
  // `preload="none"` continua: a URL entra, mas o arquivo só é baixado
  // quando alguém aperta o play. Numa transmissão isso é a diferença entre
  // 50 downloads e os poucos que realmente vão ouvir.
  const audios = document.querySelectorAll('audio[data-anexo-audio]:not([src])');
  for (const el of audios) {
    const u = await urlDoAnexo(el.dataset.anexoAudio);
    if (u) el.src = u; else el.replaceWith(Object.assign(document.createElement('div'),
      { className: 'anexo-sumiu', textContent: 'áudio indisponível' }));
  }
}

// O balão de anexo dentro da mensagem.
function anexosHTML(anexos) {
  if (!Array.isArray(anexos) || !anexos.length) return '';
  return '<div class="anexos">' + anexos.map((a) => {
    if (/^image\//.test(a.tipo || '')) {
      // `aspect-ratio` com o tamanho gravado: sem isso a conversa pula
      // cada vez que uma foto chega.
      const prop = a.w && a.h ? `style="aspect-ratio:${a.w}/${a.h}"` : '';
      return `<img data-anexo="${esc(a.caminho)}" ${prop} alt="foto">`;
    }
    if (/^audio\//.test(a.tipo || '')) {
      return `<audio controls preload="none" data-anexo-audio="${esc(a.caminho)}"></audio>`;
    }
    return `<a class="anexo-doc" href="#" onclick="abrirDoc('${esc(a.caminho)}');return false">`
      + `📄 ${esc(a.nome || 'documento')}</a>`;
  }).join('') + '</div>';
}

async function abrirDoc(caminho) {
  const u = await urlDoAnexo(caminho);
  if (u) window.open(u, '_blank', 'noopener');
  else alert('Arquivo indisponível.');
}

/* ══ CONTATOS DA AGENDA ═════════════════════════════════════════════
 *
 * "Olha a agenda do celular, me diz quem já tem o app, e deixa eu falar
 * com essa pessoa" — o pedido do Yuri em 06/out, com o WhatsApp como
 * referência de experiência, não de implementação.
 *
 * ── O QUE É HONESTO DIZER SOBRE ESTA VERSÃO ───────────────────────
 *
 * No navegador NÃO existe varredura automática da agenda. O seletor de
 * contatos (`navigator.contacts.select`) existe só no Chrome do Android, e
 * mesmo lá é o SISTEMA que mostra a lista e a pessoa marca quem quer — a
 * página nunca recebe os 800 contatos por conta própria. No iPhone e no
 * computador não existe nem isso.
 *
 * Então aqui:
 *   • Android — a pessoa marca vários de uma vez no seletor do sistema;
 *   • iPhone e computador — digita ou cola números, um por linha.
 *
 * O resto é idêntico ao que o app nativo vai fazer: normaliza, pergunta
 * quais têm conta, separa em "já estão" e "convidar". No dia em que o app
 * sair, troca-se SÓ a leitura da agenda — a comparação, a separação, o
 * convite e a conversa continuam estes.
 *
 * ── ONDE A AGENDA FICA ────────────────────────────────────────────
 *
 * No aparelho, e só nele (`localStorage`). Os nomes NUNCA sobem para o
 * servidor: o que sobe são números, para a comparação, e o servidor não
 * guarda nada — nem os que casaram, nem os 793 que não casaram. É o item
 * 6 do pedido dele, e o desenho todo depende disto: não existe tabela de
 * agenda no banco para encher.
 */
const AGENDA_CHAVE = 'cnr_agenda';   // só neste aparelho
let AGENDA = [];      // [{ nome, telefone }] — como a pessoa escolheu
let AGENDA_TEM = [];  // os que têm conta: [{ telefone, conta_id, nome }]
let AGENDA_BUSCA = '';
let AGENDA_ESTADO = '';   // '', 'lendo', 'comparando'

const TEM_AGENDA = !!(navigator.contacts && navigator.contacts.select);
// O compartilhar do próprio aparelho — este o Safari do iPhone TEM. É o
// que faz o convite sair pelo WhatsApp da pessoa sem o Gerador encostar na
// conta de WhatsApp dela.
const TEM_COMPARTILHAR = !!(navigator.share);

function lerAgendaGuardada() {
  try {
    const bruto = localStorage.getItem(AGENDA_CHAVE);
    AGENDA = bruto ? JSON.parse(bruto) : [];
  } catch (e) { AGENDA = []; }    // aba privada, dado limpo: segue vazia
  if (!Array.isArray(AGENDA)) AGENDA = [];
}
function guardarAgenda() {
  try { localStorage.setItem(AGENDA_CHAVE, JSON.stringify(AGENDA)); } catch (e) { /* sem espaço: segue na memória */ }
}

function abrirAgenda() {
  // Contatos é o ponto de partida, nunca um destino de volta: aqui o `‹`
  // volta para a lista, como em qualquer outra tela.
  VEIO_DE = null;
  aberto = { tipo: 'agenda', id: null, nome: 'Contatos' };
  lerAgendaGuardada();
  desenharColuna(); desenharPainel(); verConversa(); arrumarVoltar();
  // Já tem agenda guardada deste aparelho: compara de novo ao abrir, para
  // quem criou conta depois do último olhar aparecer como "já está".
  if (AGENDA.length && !AGENDA_TEM.length) compararAgenda();
}

// ── Ler a agenda ────────────────────────────────────────────────
// No Android, pelo seletor do sistema: a permissão é pedida pelo próprio
// aparelho, e nada chega aqui sem a pessoa marcar. Negar não quebra nada —
// o resto do Gerador segue igual e este caminho fica indisponível, que é o
// item 1 do pedido.
async function lerDaAgenda() {
  if (!TEM_AGENDA) return colarNumeros();
  AGENDA_ESTADO = 'lendo'; desenharAgenda();
  try {
    const escolhidos = await navigator.contacts.select(['name', 'tel'], { multiple: true });
    const novos = [];
    (escolhidos || []).forEach((c) => {
      const nome = (c.name && c.name[0]) || '';
      // Contato com mais de um número entra uma vez por número: é comum ter
      // o fixo da loja e o celular do dono, e só um deles ser o do app.
      (c.tel || []).forEach((t) => { if (t) novos.push({ nome, telefone: String(t) }); });
    });
    juntarNaAgenda(novos);
  } catch (e) {
    // Cancelou, ou o aparelho recusou. Não é erro: é uma escolha.
  }
  AGENDA_ESTADO = ''; desenharAgenda();
  if (AGENDA.length) compararAgenda();
}

// iPhone e computador: cola os números, um por linha. Aceita "Nome, número"
// para a lista sair com nome, que é o que torna a tela legível.
function colarNumeros() {
  $('dlg-corpo').innerHTML = `<h3>Contatos</h3>
    <p style="font-size:.85rem;color:var(--text-mid);line-height:1.55;margin-bottom:.8rem">
      Este aparelho não deixa o site ler a agenda — só o aplicativo faz
      isso. Por enquanto, cole os números aqui, um por linha. Pode ser
      <em>Nome, número</em>.</p>
    <textarea id="ag-colar" rows="7" placeholder="João da Oficina, 48 99999-0000
Marcos Veículos, +55 48 98888-7777
48 97777-6666"></textarea>
    <div class="op" style="justify-content:flex-end;gap:.5rem">
      <button class="leve" onclick="dlg.close()">Cancelar</button>
      <button onclick="aceitarColados()">Procurar</button></div>`;
  $('dlg').showModal(); $('ag-colar').focus();
}

function aceitarColados() {
  const texto = ($('ag-colar') && $('ag-colar').value) || '';
  const novos = [];
  texto.split(/[\n;]+/).forEach((linha) => {
    const t = linha.trim();
    if (!t) return;
    // "Nome, número" ou só o número. O nome é o que vem antes da última
    // vírgula; o resto, o telefone.
    const corte = t.lastIndexOf(',');
    const nome = corte > 0 ? t.slice(0, corte).trim() : '';
    const tel = corte > 0 ? t.slice(corte + 1).trim() : t;
    if (/\d/.test(tel)) novos.push({ nome, telefone: tel });
  });
  $('dlg').close();
  if (!novos.length) return;
  juntarNaAgenda(novos);
  compararAgenda();
}

// Junta sem repetir. O mesmo número salvo em dois contatos, e o mesmo
// contato escolhido duas vezes, são a regra numa agenda de verdade.
function juntarNaAgenda(novos) {
  const chave = (c) => so(c.telefone);
  const tenho = new Set(AGENDA.map(chave));
  novos.forEach((c) => {
    const k = chave(c);
    if (!k || tenho.has(k)) return;
    tenho.add(k);
    AGENDA.push({ nome: c.nome || '', telefone: c.telefone });
  });
  guardarAgenda();
  desenharAgenda();
}

// Só os dígitos, para comparar o que a pessoa digitou com o que voltou do
// servidor. A normalização DE VERDADE é a do servidor (`_sessao.js`), uma
// só para o login e para a agenda; esta aqui é só para casar a resposta
// com a linha certa da tela.
const so = (t) => String(t || '').replace(/\D/g, '');

// ── Comparar: quem destes tem conta ─────────────────────────────
// Sobem NÚMEROS, nunca nomes. E nada volta gravado em lugar nenhum.
async function compararAgenda() {
  if (!AGENDA.length) return;
  AGENDA_ESTADO = 'comparando'; desenharAgenda();
  try {
    const r = await rede('agenda', { body: { telefones: AGENDA.map((c) => c.telefone) } });
    AGENDA_TEM = r.contatos || [];
  } catch (e) {
    AGENDA_TEM = [];
    alert('Não consegui conferir agora: ' + e.message);
  }
  AGENDA_ESTADO = ''; desenharAgenda();
}

function esquecerAgenda() {
  if (!confirm('Esquecer os contatos guardados neste aparelho?\n\nNada é apagado da tua agenda — só a cópia que o Gerador tinha para comparar.')) return;
  AGENDA = []; AGENDA_TEM = []; AGENDA_BUSCA = '';
  try { localStorage.removeItem(AGENDA_CHAVE); } catch (e) { /* nada a fazer */ }
  desenharAgenda();
}

// ── A tela ──────────────────────────────────────────────────────
function desenharAgenda() {
  if (!aberto || aberto.tipo !== 'agenda') return;
  // O número que casou vem do servidor já normalizado; o da tela, não. Os
  // últimos 8 dígitos casam os dois sem depender de DDD nem de código de
  // país — é o que resolve "com DDD, sem DDD, com +55".
  const fim = (t) => so(t).slice(-8);
  const temConta = new Map(AGENDA_TEM.map((c) => [fim(c.telefone), c]));

  const busca = AGENDA_BUSCA.trim().toLowerCase();
  const casa = (c) => !busca
    || (c.nome || '').toLowerCase().includes(busca)
    || so(c.telefone).includes(so(busca));

  const vistos = new Set();
  const naRede = [], deFora = [];
  let euMesmo = 0;
  AGENDA.filter(casa).forEach((c) => {
    const loja = temConta.get(fim(c.telefone));
    // O meu próprio número não é contato: não entra em "no Gerador" (não
    // se conversa consigo mesmo) nem em "convidar" (seria eu convidando
    // eu). Sai da lista e aparece como uma nota, para a pessoa saber que
    // o número foi reconhecido e não ignorado.
    if (loja && loja.eu) { euMesmo++; return; }
    if (loja) {
      // Duas linhas da agenda podem ser a mesma loja (fixo e celular).
      // Na lista ela aparece uma vez.
      if (vistos.has(loja.conta_id)) return;
      vistos.add(loja.conta_id);
      naRede.push({ ...c, loja });
    } else {
      deFora.push(c);
    }
  });

  $('pan-sub').innerHTML = AGENDA.length
    ? `${AGENDA.length} contato(s) neste aparelho · ${naRede.length} na rede`
      + ` · <a href="#" onclick="esquecerAgenda();return false" style="color:var(--text-faint)">esquecer</a>`
    : 'nenhum contato ainda';

  const trabalhando = AGENDA_ESTADO === 'comparando' ? 'Conferindo…'
    : AGENDA_ESTADO === 'lendo' ? 'Abrindo a agenda…' : '';

  // A LINHA TODA abre a conversa, não só o botão.
  // [YURI, 06/out: "tá ruim de selecionar"] — e estava: o alvo era um botão
  // de 2cm² no canto direito, e tocar no nome da loja não fazia nada. No
  // WhatsApp a linha é a porta. O botão fica, porque diz o que vai
  // acontecer a quem nunca tocou aqui.
  const linhaLoja = (c) => `
    <div class="ag-item clicavel" onclick="conversarDaAgenda('${c.loja.conta_id}')">
      <div class="avatar">🏪</div>
      <div class="txt">
        <div class="t1">${esc(c.nome || c.loja.nome)}</div>
        <div class="t2"><span class="ag-pin na">●</span> ${esc(c.loja.nome)} está na rede</div>
      </div>
      <div class="pedido-bts">
        <button onclick="conversarDaAgenda('${c.loja.conta_id}');event.stopPropagation()">Conversar</button>
      </div>
    </div>`;

  const linhaFora = (c) => `
    <div class="ag-item">
      <div class="avatar">👤</div>
      <div class="txt">
        <div class="t1">${esc(c.nome || c.telefone)}</div>
        <div class="t2"><span class="ag-pin fora">●</span> ainda não usa o Gerador</div>
      </div>
      <div class="pedido-bts">
        <button class="leve" onclick="convidar(${JSON.stringify(c.nome || '').replace(/"/g, '&quot;')})">Convidar</button>
      </div>
    </div>`;

  $('thread').innerHTML =
    `<div class="ag-topo">
       <input type="search" id="ag-busca" placeholder="🔎 Buscar contato"
              value="${esc(AGENDA_BUSCA)}" oninput="AGENDA_BUSCA=this.value;desenharAgenda()">
       <div class="ag-bts">
         <button onclick="lerDaAgenda()">${TEM_AGENDA ? '📇 Escolher da agenda' : '📋 Colar números'}</button>
         ${AGENDA.length ? '<button class="leve" onclick="compararAgenda()">Atualizar</button>' : ''}
       </div>
       ${trabalhando ? `<div class="ag-trab">${trabalhando}</div>` : ''}
       ${euMesmo ? '<div class="ag-trab">Um dos números é o teu — esse não aparece na lista.</div>' : ''}
     </div>`
    + (!AGENDA.length
      ? `<div class="vazio">${TEM_AGENDA
          ? 'Escolha contatos da agenda e eu digo quais já estão na rede.'
          : 'Este aparelho não deixa o site ler a agenda — só o aplicativo faz isso.<br>'
            + 'Cole os números e eu digo quais já estão na rede.'}</div>`
      : (naRede.length
          ? `<div class="grupo">No Gerador · ${naRede.length}</div>` + naRede.map(linhaLoja).join('')
          : '')
        + (deFora.length
          ? `<div class="grupo">Convidar · ${deFora.length}</div>` + deFora.map(linhaFora).join('')
          : '')
        + (!naRede.length && !deFora.length ? '<div class="vazio">Nenhum contato com esse nome.</div>' : ''));
}

/* ── Bloquear ────────────────────────────────────────────────────
 *
 * A válvula da regra nova: se quem tem o meu número me chama direto, tem
 * de haver como calar quem incomoda. Não avisa a outra loja — bloqueio que
 * avisa é discussão, não bloqueio.
 */
async function bloquearLoja(contaId, nome) {
  if (!confirm(`Bloquear ${nome || 'esta loja'}?\n\n`
    + 'Ela deixa de te mandar mensagem e carro. O que já foi dito continua escrito. '
    + 'Ela não é avisada.')) return;
  try {
    await rede('bloquear', { body: { conta_id: contaId, bloquear: true } });
    aberto = null;
    AGENDA_TEM = [];            // ela sai da lista da agenda na próxima conferida
    await carregar();
    if (AGENDA.length) compararAgenda();
    verLista();
    alert('Bloqueada.');
  } catch (e) { alert(e.message); }
}

/* ── O convite ───────────────────────────────────────────────────
 *
 * Abre o compartilhar do próprio aparelho: a pessoa escolhe WhatsApp, SMS,
 * e-mail, o que ela usa. O Gerador não encosta na conta de WhatsApp dela.
 *
 * ── POR QUE O LINK NÃO LEVA CÓDIGO DE QUEM CONVIDOU ──────────────
 *
 * O pedido original pedia um link que identificasse o convite. Não vou
 * pôr: o que identificaria a loja no link é o `conta_id`, e é justamente
 * ele que permite abrir conversa com ela (a regra nova de 06/out). Num
 * convite que vai ser encaminhado em grupo de WhatsApp, isso é a chave da
 * porta circulando.
 *
 * E não precisa: quando a pessoa convidada criar conta com o número dela,
 * ela aparece sozinha como "está na rede" na agenda de quem convidou —
 * porque o número já está lá. A atribuição acontece pela agenda, sem
 * token, sem registro e sem nada a vazar.
 */
async function convidar(nome) {
  const texto = (nome ? `${nome}, ` : '')
    + 'estou usando o Gerador da Carro na Rede para repasse de carros. '
    + 'Entra lá também: ' + location.origin;
  if (TEM_COMPARTILHAR) {
    try { await navigator.share({ text: texto }); return; }
    catch (e) { /* cancelou, ou o aparelho não abriu: cai na cópia */ }
  }
  try {
    await navigator.clipboard.writeText(texto);
    alert('Convite copiado. Cole no WhatsApp de quem tu queres chamar.');
  } catch (e) {
    alert(texto);   // último recurso: ao menos dá para copiar com a mão
  }
}

/* ══ A PORTA DA REDE — pelo número, como na agenda ══════════════════
 *
 * Decisão do Yuri, 06/out: uma loja acha a outra "através da agenda,
 * igual ao WhatsApp". O navegador NÃO lê a agenda como o WhatsApp lê — a
 * API que faz isso (`navigator.contacts`) existe só no Chrome do Android,
 * e mesmo lá a pessoa escolhe um contato de cada vez, nunca a lista toda.
 *
 * Mas o que faz o modelo do WhatsApp funcionar não é ler a agenda: é o
 * NÚMERO ser o endereço. Então é isso que está feito aqui — e a regra que
 * ele queria cai de graça: **só acha quem já tem o teu número.** Não
 * existe diretório de lojas, ninguém descobre estranho.
 *
 * Onde a agenda existe, ela entra como atalho. Onde não existe (iPhone,
 * notebook), a pessoa digita ou cola — mesmo resultado.
 *
 * `TEM_AGENDA` é declarado no bloco de Contatos, acima — um só, porque
 * duas verificações do mesmo recurso viram duas respostas diferentes no
 * dia em que uma delas mudar.
 */
function entrarNumaLista() {
  $('dlg-corpo').innerHTML = `<h3>Entrar na lista de uma loja</h3>
    <p style="font-size:.85rem;color:var(--text-mid);line-height:1.55;margin-bottom:.8rem">
      Pelo número, como no WhatsApp. Quem está na rede com esse número
      recebe o teu pedido — e decide.</p>
    <input type="tel" id="pedir-tel" placeholder="48 99999-0000" inputmode="tel" autocomplete="tel">
    ${TEM_AGENDA ? `<div class="op" style="justify-content:flex-start">
      <button class="leve" onclick="daAgenda()">📇 Escolher da agenda</button></div>` : ''}
    <div class="op" style="justify-content:flex-end;gap:.5rem">
      <button class="leve" onclick="dlg.close()">Cancelar</button>
      <button onclick="pedirEntrada()">Pedir para entrar</button></div>`;
  $('dlg').showModal(); $('pedir-tel').focus();
}

// O seletor do próprio sistema: nada da agenda chega aqui sem a pessoa
// tocar no contato. A página nunca vê a lista, só o que foi escolhido.
async function daAgenda() {
  try {
    const [c] = await navigator.contacts.select(['tel'], { multiple: false });
    const tel = c && c.tel && c.tel[0];
    if (tel) $('pedir-tel').value = tel;
  } catch (e) { /* cancelou, ou o aparelho não deixou: segue digitando */ }
}

async function pedirEntrada() {
  const telefone = $('pedir-tel').value.trim();
  if (!telefone) return $('pedir-tel').focus();
  try {
    await rede('solicitar', { body: { telefone } });
    $('dlg').close();
    // A MESMA frase, exista o número ou não. Se a tela dissesse "esse
    // número não está na rede", ela viraria um detector: mil números,
    // mil respostas, a rede inteira descoberta. O login já decidiu isso
    // em 27/set e aqui vale igual, senão basta trocar de tela.
    alert('Pedido enviado.\n\nSe esse número estiver na rede, a loja vai ver o teu pedido e responder.');
    await carregar();
  } catch (e) { alert(e.message); }
}

async function responderPedido(id, aceitar) {
  if (!aceitar && !confirm('Recusar este pedido?')) return;
  try {
    await rede('responder', { body: { solicitacao_id: id, aceitar } });
    await carregar();
  } catch (e) { alert(e.message); }
}

async function sairDaLista(donoContaId, nome) {
  if (!confirm(`Sair da lista de ${nome}?\n\nVocê deixa de receber os carros dela. Dá para pedir de novo depois.`)) return;
  try {
    await rede('sair', { body: { dono_conta_id: donoContaId } });
    await carregar();
  } catch (e) { alert(e.message); }
}

/* ── O cadastro: o número, uma vez, antes da Rede abrir ────────────
 *
 * Não é um alerta que se fecha: é a tela, no lugar da Rede, até o número
 * estar gravado. O app nas lojas vai pedir isso no cadastro, e aqui é o
 * mesmo passo adiantado — quem já tem número nunca vê isto.
 *
 * O que está escrito aqui é verdade pela metade de propósito: o número
 * ainda NÃO é confirmado por SMS (o envio está desligado). Então a tela
 * não promete confirmação; ela diz o que o número faz, que é te tornar
 * achável. No app isso vira código por SMS, como no WhatsApp.
 */
function pedirMeuNumero() {
  $('col').innerHTML = '<div class="aviso">'
    + '<strong>Qual é o teu número?</strong><br>'
    + 'Na rede, uma loja acha a outra pelo número — como no WhatsApp. '
    + 'Quem já tem o teu na agenda pode te chamar; quem não tem, não te encontra.'
    + '<div style="display:flex;flex-direction:column;gap:.5rem;margin-top:.9rem">'
    + '<input type="tel" id="cad-tel" placeholder="48 99999-0000" inputmode="tel" autocomplete="tel">'
    + '<button id="cad-bt" onclick="salvarCadastro()">Continuar</button>'
    + '<span style="color:var(--text-faint);font-size:.75rem;text-align:center">'
    + 'Só as lojas que já têm o teu número conseguem te chamar.</span>'
    + '</div></div>';
  verLista();
  const campo = document.getElementById('cad-tel');
  if (campo) {
    campo.focus();
    // Enter manda, como em qualquer campo de telefone. Sem isto, no celular
    // o teclado mostra "ir" e o toque não faz nada.
    campo.addEventListener('keydown', (e) => { if (e.key === 'Enter') salvarCadastro(); });
  }
}

async function salvarCadastro() {
  const campo = document.getElementById('cad-tel');
  const bt = document.getElementById('cad-bt');
  const tel = (campo && campo.value.trim()) || '';
  if (!tel) return campo && campo.focus();
  if (bt) { bt.disabled = true; bt.textContent = 'Salvando…'; }
  try {
    await gravarNumero(tel);
    // Só agora a Rede abre, e com tudo que já foi carregado.
    desenharColuna();
    abrirRecebidos(); verLista();
  } catch (e) {
    alert(e.message);
    if (bt) { bt.disabled = false; bt.textContent = 'Continuar'; }
  }
}

// ── Meu número ──────────────────────────────────────────────
// Trocar ou apagar, depois de cadastrado. Cada um mexe no SEU: ninguém
// cadastra o número de ninguém, nem pela tela de convite — no WhatsApp o
// teu número é teu.
function meuNumero() {
  $('dlg-corpo').innerHTML = `<h3>Meu número</h3>
    <p style="font-size:.85rem;color:var(--text-mid);line-height:1.55;margin-bottom:.8rem">
      É assim que as outras lojas te acham: quem já tem o teu número na
      agenda pode pedir para entrar na tua lista. Quem não tem, não te
      encontra.</p>
    <input type="tel" id="meu-tel" placeholder="48 99999-0000" inputmode="tel"
           autocomplete="tel" value="${esc(MEU_TELEFONE || '')}">
    <div class="op" style="justify-content:space-between;gap:.5rem">
      ${MEU_TELEFONE ? '<button class="leve" onclick="apagarMeuNumero()">Apagar</button>' : '<span></span>'}
      <span><button class="leve" onclick="dlg.close()">Cancelar</button>
      <button onclick="salvarMeuNumero()">Salvar</button></span></div>`;
  $('dlg').showModal(); $('meu-tel').focus();
}

async function gravarNumero(telefone) {
  const r = await fetch('/api/utils?type=meu-telefone', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ telefone }),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
  MEU_TELEFONE = d.telefone;
  // `close()` num diálogo fechado não faz nada — serve para esta função
  // atender tanto a janela de trocar número quanto a tela de cadastro.
  $('dlg').close();
  // Apagou o número: volta para o cadastro, em vez de ficar numa Rede que
  // não abriria se a pessoa recarregasse a página. Duas telas dizendo
  // coisas diferentes sobre a mesma regra é como nasce o bug que ninguém
  // reproduz.
  if (!MEU_TELEFONE) return pedirMeuNumero();
  desenharColuna();
}

async function salvarMeuNumero() {
  const tel = $('meu-tel').value.trim();
  if (!tel) return $('meu-tel').focus();
  try { await gravarNumero(tel); } catch (e) { alert(e.message); }
}

async function apagarMeuNumero() {
  if (!confirm('Apagar o teu número?\n\nNinguém mais vai conseguir te achar para pedir para entrar na tua lista.')) return;
  try { await gravarNumero(''); } catch (e) { alert(e.message); }
}

// ── Convidar uma loja ───────────────────────────────────────
// O SMS está desligado, então sem isto convidar alguém seria ler um
// código de seis dígitos no registro da Vercel e repassar no WhatsApp.

    + 'Cria a loja no sistema e gera um link. Quem abrir o link entra direto — '

    // A pessoa vem PRIMEIRO, e a loja é opcional: repassador em geral
    // não tem loja — é ele e o telefone. Pedir loja obrigava a inventar
    // um nome (correção do Yuri, 29/set).
    + '<label style="display:block;font-size:.78rem;color:var(--text-mid);margin-bottom:.15rem">Nome da pessoa</label>'
    + '<input id="cv-pessoa" placeholder="ex: Fabio Nogueira" maxlength="80" '
    + 'style="width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:var(--r, 8px);'
    + 'background:var(--surface-raise);color:var(--text);font-family:inherit;font-size:.92rem;margin-bottom:.6rem">'
    + '<label style="display:block;font-size:.78rem;color:var(--text-mid);margin-bottom:.15rem">'
    + 'Nome da loja <span style="color:var(--text-faint)">— se tiver</span></label>'
    + '<input id="cv-loja" placeholder="deixe vazio se for repassador" maxlength="80" '
    + 'style="width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:var(--r, 8px);'
    + 'background:var(--surface-raise);color:var(--text);font-family:inherit;font-size:.92rem;margin-bottom:.9rem">'
    // O que a pessoa É. Muda o que ela vê: lojista tem pátio e preparação,
    // repassador não — o carro nunca entra no estoque dele.
    //
    // Nenhum vem marcado de propósito. Um padrão aqui escolheria pela

    //
    // Hoje o convite É o cadastro (ninguém entra sozinho), então é aqui

    + '<label style="display:block;font-size:.78rem;color:var(--text-mid);margin-bottom:.3rem">O que ela é</label>'
    + '<div class="cv-tipo" style="display:flex;gap:.5rem;margin-bottom:.9rem">'
    + '<button type="button" class="leve" data-tipo="repassador" onclick="cvTipo(this)" style="flex:1">'
    + 'Repassador<br><span style="font-size:.7rem;opacity:.7">não tem pátio</span></button>'
    + '<button type="button" class="leve" data-tipo="lojista" onclick="cvTipo(this)" style="flex:1">'
    + 'Lojista<br><span style="font-size:.7rem;opacity:.7">tem estoque e preparação</span></button>'
    + '</div>'
    + '<div id="cv-saida"></div>'
    + '<div class="op" style="justify-content:flex-end;gap:.5rem">'
    + '<button class="leve" onclick="dlg.close()">Fechar</button>'
    + '<button id="cv-ok" onclick="gerarConvite()">Gerar link</button></div>';
  // Zera a escolha a cada abertura: sem isto, o segundo convite da sessão
  // nasceria com o tipo do primeiro já marcado, e ninguém veria.
  _cvTipo = null;
  $('dlg').showModal();
  setTimeout(() => $('cv-pessoa').focus(), 50);
}

// Escolha única, e sem nenhum marcado ao abrir.
let _cvTipo = null;
function cvTipo(btn) {
  _cvTipo = btn.dataset.tipo;
  document.querySelectorAll('.cv-tipo button').forEach((b) => {
    const eu = (b === btn);
    b.classList.toggle('leve', !eu);
    b.style.outline = eu ? '1px solid var(--text)' : '';
  });
}

async function gerarConvite() {
  const loja = $('cv-loja').value.trim();
  const pessoa = $('cv-pessoa').value.trim();
  if (!pessoa) { alert('Escreva ao menos o nome da pessoa.'); return; }
  // Perguntar aqui e deixar passar em branco seria o mesmo que não
  // perguntar: sem tipo, a loja abre sem saber que metade do sistema
  // existe, e não há tela para ela corrigir isso sozinha.
  if (!_cvTipo) { alert('Marque se é repassador ou lojista.'); return; }
  const btn = $('cv-ok');
  btn.disabled = true; btn.textContent = 'Criando…';
  try {
    const r = await fetch('/api/utils?type=convite', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ loja, pessoa, tipo: _cvTipo }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
    // O link fica num campo selecionável, e não só num botão de copiar:
    // se a cópia falhar — e falha, em navegador embutido —, ele ainda
    // pode marcar e copiar à mão.
    $('cv-saida').innerHTML =
      '<div style="border:1px solid var(--line);border-radius:var(--r, 8px);padding:.7rem;margin-bottom:.8rem">'
      + `<div style="font-size:.78rem;color:var(--text-mid);margin-bottom:.4rem">Link de ${esc(d.pessoa)} — ${esc(d.loja)}</div>`
      + `<input id="cv-link" readonly value="${esc(d.link)}" onclick="this.select()" `
      + 'style="width:100%;padding:.5rem;border:1px solid var(--line);border-radius:var(--r, 8px);'
      + 'background:var(--surface);color:var(--text);font-family:monospace;font-size:.72rem">'
      + '<div style="display:flex;gap:.5rem;margin-top:.5rem">'
      + '<button onclick="copiarConvite()">Copiar</button>'
      + `<a href="https://wa.me/?text=${encodeURIComponent('Entra aqui: ' + d.link)}" target="_blank" `
      + 'rel="noopener" style="text-decoration:none"><button class="leve">Mandar no WhatsApp</button></a></div>'
      + '<div style="font-size:.72rem;color:var(--text-faint);margin-top:.5rem;line-height:1.5">'
      + 'Quem abrir este link entra na loja. Mande só para essa pessoa.</div></div>';
    btn.textContent = 'Gerar outro';
  } catch (e) {
    $('cv-saida').innerHTML = `<div class="aviso">Não consegui criar: ${esc(e.message)}</div>`;
    btn.textContent = 'Gerar link';
  } finally { btn.disabled = false; }
}

function copiarConvite() {
  const campo = $('cv-link');
  campo.select();
  navigator.clipboard.writeText(campo.value)
    .then(() => alert('Link copiado.'))
    .catch(() => alert('Não consegui copiar. O link está selecionado — use Ctrl+C.'));
}
// ── Ser avisado no celular ──────────────────────────────────
// A chave pública identifica o remetente do aviso; ela vai para o
// navegador de qualquer jeito, então não é segredo.
const VAPID_PUBLICA = 'BBC7R1zlyfXM0Rd5QUsxrWAO0NTvLL8kCewulHJVEMRm1uKuL3OvSWzXKe3CZ-CW7KpzGqbIUKn5vgRjfYcn_YM';
const paraBytes = (b64) => {
  const s = (b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/');
  return Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
};

/* ══ O AVISO, QUE EXISTIA E NINGUÉM LIGAVA (06/out) ══════════════════
 *
 * [YURI: "precisa colocar notificação de msg tb"] O aviso de mensagem já
 * estava construído desde 27/set — e chega com o nome de quem falou e o
 * texto, e mensagem até GANHA de carro na fila. O que faltava era alguém
 * ligar: no sistema inteiro havia UMA assinatura, do aparelho dele, de
 * 27/set. O Nogueira não tinha nenhuma, então a mensagem que o Yuri mandou
 * não tinha para onde ir.
 *
 * O motivo é a tela: quem liga é um 🔔 sem rótulo no canto, e o estado
 * dele se perdia ao recarregar — ele só clareava depois de assinar, e na
 * volta seguinte estava apagado outra vez, dizendo "desligado" sobre um
 * aparelho ligado. Ninguém aperta um botão desses, e quem apertou não
 * tinha como saber que deu certo.
 *
 * Três consertos: o sino mostra o ESTADO de verdade, a pergunta aparece na
 * HORA em que ela faz sentido (acabei de mandar mensagem, quero saber da
 * resposta), e pergunta UMA vez — recusa é resposta, não convite para
 * insistir.
 */
const AVISO_JA_PERGUNTEI = 'cnr_aviso_perguntei';

// O estado verdadeiro vem de duas coisas: a permissão do navegador e a
// assinatura que existe neste aparelho. Uma sem a outra não avisa nada.
async function estadoDoAviso() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return 'impossivel';
  if (typeof Notification === 'undefined') return 'impossivel';
  if (Notification.permission === 'denied') return 'recusado';
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const ass = reg && await reg.pushManager.getSubscription();
    if (ass && Notification.permission === 'granted') return 'ligado';
  } catch (e) { /* sem registro ainda */ }
  return 'desligado';
}

async function arrumarSino() {
  const b = document.getElementById('btn-avisar');
  if (!b) return;
  const e = await estadoDoAviso();
  b.dataset.estado = e;
  b.classList.toggle('leve', e !== 'ligado');
  b.textContent = e === 'ligado' ? '🔔' : '🔕';
  b.title = {
    ligado: 'Avisos ligados neste aparelho — toque para conferir',
    desligado: 'Avisos desligados — toque para ser avisado de mensagem e carro',
    recusado: 'Você recusou os avisos neste navegador',
    impossivel: 'Este aparelho não recebe aviso',
  }[e];
}

// Pergunta no momento certo, e uma vez só.
async function convidarParaAviso() {
  if ((await estadoDoAviso()) !== 'desligado') return;
  try { if (localStorage.getItem(AVISO_JA_PERGUNTEI)) return; } catch (e) { /* segue e pergunta */ }
  try { localStorage.setItem(AVISO_JA_PERGUNTEI, '1'); } catch (e) { /* sem espaço: pode repetir */ }
  if (!confirm('Quer ser avisado no celular quando responderem?\n\n'
    + 'Sem isso, a resposta só aparece quando você abrir o Gerador.')) return;
  pedirAviso();
}

async function pedirAviso() {
  // Cada motivo tem a sua frase: "não deu" sem dizer por quê faz a
  // pessoa tentar de novo esperando outro resultado.
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    return alert('Este navegador não recebe aviso.\n\nNo iPhone, só funciona com o app na tela de início:\nabra pelo Safari e use Compartilhar → Adicionar à Tela de Início.');
  }
  try {
    const permissao = await Notification.requestPermission();
    if (permissao !== 'granted') {
      return alert('Sem permissão, não dá para avisar.\n\nSe você recusou sem querer, libere nas configurações do navegador para este site.');
    }
    const reg = await navigator.serviceWorker.ready;
    const ass = await reg.pushManager.subscribe({
      userVisibleOnly: true,                       // exigido: todo aviso aparece
      applicationServerKey: paraBytes(VAPID_PUBLICA),
    });
    const j = ass.toJSON();
    const r = await rede('assinar', { body: { endpoint: j.endpoint, p256dh: j.keys?.p256dh, auth: j.keys?.auth } });
    await arrumarSino();
    // O aparelho pode estar assinado e o envio desligado no servidor. Dizer
    // "pronto" nesse caso seria prometer um aviso que nunca sai.
    if (r && r.ligado === false) {
      alert('Este aparelho ficou registrado, mas o envio de avisos ainda está desligado no servidor.\n\nNada foi perdido: assim que ligar, os avisos passam a chegar aqui sem você precisar refazer nada.');
    } else {
      alert('Pronto. Você será avisado quando chegar carro ou mensagem.');
    }
  } catch (e) {
    alert('Não consegui ligar o aviso: ' + e.message);
  }
}
$('btn-avisar').addEventListener('click', pedirAviso);
// O sino nasce dizendo a verdade, em vez de nascer apagado e só clarear
// depois de alguém assinar nesta visita.
arrumarSino();

/* ══ O TECLADO QUE COBRIA O CAMPO (06/out) ═══════════════════════════
 *
 * [YURI: "o campo para digitar ainda tá cortado"] — depois de eu consertar
 * a soma com a faixa do topo. Eram DOIS defeitos no mesmo lugar, e o
 * segundo é do iPhone: quando o teclado abre, nem `100vh` nem `100dvh`
 * encolhem. A página segue do mesmo tamanho e o teclado passa POR CIMA do
 * fim dela — e o fim da página é o campo de escrever. Com `overflow:hidden`
 * no body, não há nem como rolar para enxergar.
 *
 * Quem sabe o tamanho de verdade é o `visualViewport`: a parte da página
 * que a pessoa está REALMENTE vendo. A diferença entre ele e a janela é o
 * que o teclado comeu.
 *
 * `offsetTop` entra na conta porque o iOS, além de cobrir, às vezes
 * EMPURRA a página para cima ao focar um campo; sem isso a medida sai
 * curta justamente no caso em que ela mais importa.
 *
 * Sem `visualViewport` (navegador antigo), `--teclado` fica em 0 e tudo
 * volta a ser o que era — nada piora.
 */
(function (vv) {
  if (!vv) return;
  const medir = () => {
    // Quanto do fundo da janela está fora da área visível.
    const coberto = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    // Ruído de 1 ou 2 pixels durante a rolagem não vale um recálculo de
    // layout a cada quadro.
    document.documentElement.style.setProperty('--teclado', (coberto > 8 ? coberto : 0) + 'px');
  };
  vv.addEventListener('resize', medir);
  vv.addEventListener('scroll', medir);
  medir();

  // Ao focar o campo, o iOS pode ter empurrado a página inteira para cima.
  // Devolver ao topo é o que faz a faixa do topo e a conversa voltarem para
  // o lugar — e a medida acima cuida do resto.
  $('texto').addEventListener('focus', () => {
    setTimeout(() => { window.scrollTo(0, 0); medir(); $('thread').scrollTop = $('thread').scrollHeight; }, 60);
  });
}(window.visualViewport));

$('btn-carro').addEventListener('click', escolherCarro);
$('btn-enviar').addEventListener('click', enviar);

    + '<button onclick="dlg.close();arqGaleria.click()">Escolher</button></div>'

});
// O microfone só aparece onde o aparelho sabe gravar. Botão que aparece e

$('btn-mic').addEventListener('click', gravarAudio);

const arqGaleria = $('arq-galeria');
const arqCamera = $('arq-camera');
[arqGaleria, arqCamera].forEach((campo) => {
  campo.addEventListener('change', () => {
    escolherArquivos(campo.files);

});
$('texto').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); }
});
$('texto').addEventListener('input', (e) => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 128) + 'px';
});
</script>
