<style>
*{margin:0;padding:0;box-sizing:border-box}
/* `display:` de classe vence o atributo `hidden` — sem isto, o campo de
   digitar aparecia em "Chegou para mim", onde não se manda nada. */
[hidden]{display:none!important}
/* `100vh` no celular conta a barra de endereço do navegador como se ela
   não existisse: o rodapé da tela fica ABAIXO do que se enxerga, e a
   rolagem de dentro não alcança o fim da lista. Foi o que aconteceu em
   27/set — quatro carros na tela, dois visíveis, e nada de rolar.
   `100dvh` é a altura que existe de fato; `100vh` fica antes, como
   reserva para navegador que não conheça a unidade nova. */
html,body{height:100%}
body{font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text);
  overflow:hidden}

/* Duas colunas no notebook, uma de cada vez no celular — igual ao WhatsApp. */
.tela{display:grid;grid-template-columns:20rem 1fr;height:100vh;height:100dvh}
@media (max-width:760px){
  .tela{grid-template-columns:1fr}
  /* `.tela .coluna` e não `.coluna`: a regra base que dá `display:flex` à
     coluna está escrita MAIS ABAIXO neste arquivo, e em empate de peso
     quem vem depois ganha. Com `.coluna` simples aqui, a coluna nunca se
     escondia no celular — a lista e o painel ficavam empilhados, o painel
     sobrava com um pedaço da tela, e cabiam dois carros. Foi o que o Yuri
     viu em 27/set, e eu quase diagnostiquei como rolagem travada.
     É o mesmo tropeço do `display:` de classe vencendo o `hidden`, dez
     linhas acima. */
  .tela .coluna{display:none}
  .tela[data-onde="lista"] .coluna{display:flex}
  .tela[data-onde="conversa"] .painel{display:flex}
  .tela[data-onde="lista"] .painel{display:none}
  .voltar{display:inline-flex!important}
}

/* ── Coluna da esquerda ─────────────────────────────────────── */
.coluna{border-right:1px solid var(--line);display:flex;flex-direction:column;
  min-width:0;min-height:0}
.col-topo{padding:1rem .9rem .7rem;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.col-topo h1{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:900}
.rolagem{flex:1;overflow-y:auto}

.item{display:flex;gap:.7rem;align-items:center;padding:.75rem .9rem;cursor:pointer;
  border-bottom:1px solid var(--line)}
.item:hover{background:var(--surface-raise)}
.item.ativo{background:var(--surface-raise)}
.avatar{width:2.6rem;height:2.6rem;border-radius:50%;background:var(--surface-raise);
  border:1px solid var(--line);display:grid;place-items:center;font-size:1.1rem;flex:none}
.item .txt{min-width:0;flex:1}
.item .t1{font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:.78rem;color:var(--text-mid);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:.1rem}
.item .hora{font-size:.68rem;color:var(--text-faint);flex:none;align-self:flex-start}
.grupo{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);
  padding:.9rem .9rem .35rem;font-weight:700}

/* ── Painel da direita ──────────────────────────────────────── */
/* Altura da célula do grid, não da janela outra vez: com `100vh` aqui, o
   painel ficava mais alto que o espaço que a `.tela` lhe deu, e o fim da
   lista saía da tela. `min-height:0` é o que permite o `.thread` rolar
   por dentro em vez de esticar o pai. */
.painel{display:flex;flex-direction:column;min-width:0;height:100%;min-height:0}
.pan-topo{padding:.8rem .95rem;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:.7rem}
.pan-topo h2{font-size:1rem;font-weight:700;line-height:1.2}
.pan-topo .sub{font-size:.75rem;color:var(--text-mid)}
.voltar{display:none;align-items:center;background:none;border:none;color:var(--text);
  font-size:1.2rem;cursor:pointer;padding:.2rem .4rem 0 0}

/* `min-height:0` num filho de flex não é detalhe: sem ele o padrão é
   `auto`, o `.thread` cresce com o conteúdo em vez de rolar, e empurra o
   campo de digitar para fora da tela. */
.thread{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:1rem .95rem;display:flex;flex-direction:column;gap:.7rem}
.balao{max-width:30rem;align-self:flex-end;background:var(--surface-raise);
  border:1px solid var(--line);border-radius:var(--r-md, 12px);padding:.7rem .8rem}
.balao .carro{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;line-height:1.2}
.balao .meta{font-size:.78rem;color:var(--text-mid);margin-top:.15rem}
/* Sem margem própria: quem espaça é a `.linha-preco`, que o envolve. Com
   as duas, o espaço dobrava. */
.balao .preco{font-weight:700;font-size:1.05rem}
.balao .msg{font-size:.86rem;line-height:1.5;margin-top:.5rem;white-space:pre-wrap}
.balao .rodape{display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  margin-top:.55rem;padding-top:.5rem;border-top:1px solid var(--line);
  font-size:.74rem;color:var(--text-faint)}
.balao.recebido{align-self:flex-start;background:transparent}
/* Balão de conversa: só o texto e a hora, sem a moldura do cartão de carro. */
.balao.msg-so{padding:.55rem .7rem;max-width:24rem}
.balao.msg-so .msg{margin-top:0}
.balao.msg-so .rodape{border-top:none;padding-top:.25rem;margin-top:.2rem}

/* ── Cartão de carro ─────────────────────────────────────────
   A foto vem primeiro porque é assim que se olha carro: a pessoa
   reconhece o modelo antes de ler o nome dele. `aspect-ratio` fixo para
   os cartões não pularem de altura enquanto as fotos carregam. */
.balao .foto{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;
  border-radius:var(--r, 8px);background:var(--surface);margin-bottom:.55rem}
/* Preço e distância da FIPE na MESMA linha: separados, obrigam a conta de
   cabeça que o app existe para poupar. */
.balao .linha-preco{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem;margin-top:.35rem}
/* A identidade é preto e branco (03/set), então destaque não vem de cor —
   vem de forma. A pastilha `.selo` já é o vocabulário do projeto para
   isso; inventar outra marcação aqui só criaria um segundo dialeto. */
.balao .selo.fipe{border-color:var(--text-mid, #9a9a9a);color:var(--text, #f5f5f5)}
.balao .selo.fipe.acima{border-color:var(--line, #2a2a2a);color:var(--text-faint, #6e6e6e);font-weight:400}

.selo{font-size:.68rem;font-weight:700;padding:.15rem .45rem;border-radius:999px;
  border:1px solid var(--line);color:var(--text-mid);white-space:nowrap}
.selo.res{border-color:var(--accent);color:var(--accent)}

.fila{margin-top:.5rem;border-top:1px solid var(--line);padding-top:.45rem}
.fila .quem{display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  font-size:.8rem;padding:.25rem 0}

/* ── Campo de digitar ───────────────────────────────────────── */
.compor{border-top:1px solid var(--line);padding:.7rem .95rem;display:grid;gap:.55rem;
  background:var(--surface)}
.carro-escolhido{display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  font-size:.84rem;border:1px solid var(--line);border-radius:var(--r, 8px);padding:.45rem .6rem}
.escrever{display:flex;gap:.55rem;align-items:flex-end}
textarea{flex:1;font-family:inherit;font-size:.92rem;padding:.6rem .7rem;resize:none;
  border:1px solid var(--line);border-radius:var(--r-md, 12px);background:var(--surface-raise);
  color:var(--text);min-height:2.6rem;max-height:8rem}
textarea:focus{outline:none;border-color:var(--accent)}

button{font-family:inherit;font-size:.85rem;font-weight:700;padding:.55rem .9rem;
  border-radius:var(--r, 8px);border:none;background:var(--text);color:var(--surface);cursor:pointer}
button.leve{background:none;border:1px solid var(--line);color:var(--text-mid);font-weight:500}
button:disabled{opacity:.45;cursor:default}
button.redondo{width:2.7rem;height:2.7rem;border-radius:50%;padding:0;font-size:1.05rem;flex:none}

.vazio{padding:2rem 1.2rem;text-align:center;color:var(--text-faint);font-size:.9rem;line-height:1.6}
.aviso{margin:.9rem;padding:.85rem .9rem;border:1px solid var(--line);
  border-radius:var(--r-md, 12px);font-size:.86rem;line-height:1.55;color:var(--text-mid)}
.aviso strong{color:var(--text)}

dialog{border:none;border-radius:var(--r-lg, 16px);background:var(--surface-raise);color:var(--text);
  padding:0;max-width:26rem;width:calc(100% - 2rem)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{padding:1.2rem}
.dlg h3{font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:.8rem}
.dlg .op{display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  padding:.6rem 0;border-top:1px solid var(--line);font-size:.9rem}
.dlg input[type=text]{width:100%;font-family:inherit;font-size:.95rem;padding:.6rem .7rem;
  border:1px solid var(--line);border-radius:var(--r, 8px);background:var(--surface);color:var(--text)}
</style>
</head>
<body>

<div class="tela" id="tela" data-onde="lista">

  <!-- ── Esquerda: transmissões e contatos ─────────────────── -->
  <aside class="coluna">
    <div class="col-topo">
      <h1>Rede</h1>
      <button class="redondo leve" id="btn-avisar" title="Ser avisado no celular">🔔</button>
      <button class="redondo" id="btn-nova" title="Criar">✚</button>
    </div>
    <div class="rolagem" id="col"><div class="vazio">Carregando…</div></div>
  </aside>

  <!-- ── Direita: a transmissão aberta ─────────────────────── -->
  <main class="painel" id="painel">
    <div class="pan-topo">
      <button class="voltar" onclick="verLista()">‹</button>
      <div class="avatar" id="pan-icone">📣</div>
      <div style="min-width:0">
        <h2 id="pan-nome">Rede</h2>
        <div class="sub" id="pan-sub">escolha uma transmissão à esquerda</div>
      </div>
    </div>
    <div class="thread" id="thread">
      <div class="vazio">Abra uma transmissão para ver o que você mandou —
      ou <strong>Chegou para mim</strong>, para ver o que mandaram para você.</div>
    </div>
    <div class="compor" id="compor" hidden>
      <div class="carro-escolhido" id="escolhido" hidden></div>
      <div class="escrever">
        <button class="leve" id="btn-carro">🚗 Carro</button>
        <textarea id="texto" rows="1" placeholder="Escreva algo (opcional)…"></textarea>
        <button class="redondo" id="btn-enviar" title="Enviar">➤</button>
      </div>
    </div>
  </main>
</div>

<dialog id="dlg"><div class="dlg" id="dlg-corpo"></div></dialog>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const API = '/api/fetch-anuncio';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dinheiro = (v) => v == null ? '—'
  : 'R$ ' + Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
const numero = (v) => v == null ? '—' : Number(v).toLocaleString('pt-BR');
const quando = (iso) => {
  const d = new Date(iso); const hoje = new Date();
  const mesmoDia = d.toDateString() === hoje.toDateString();
  return mesmoDia ? d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
                  : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
};

async function rede(acao, opcoes = {}) {
  const r = await fetch(`${API}?rede=${acao}${opcoes.q || ''}`, {
    method: opcoes.body ? 'POST' : 'GET',
    headers: opcoes.body ? { 'Content-Type': 'application/json' } : undefined,
    body: opcoes.body ? JSON.stringify(opcoes.body) : undefined,
  });
  const corpo = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(corpo.error || `HTTP ${r.status}`), { corpo });
  return corpo;
}

// Estado da tela: o que está aberto à direita.
let aberto = null;            // { tipo: 'lista'|'todos'|'recebidos'|'conversa', id, nome }
let carroEscolhido = null;
let dados = { listas: [], contatos: [], minhas: [], recebidas: [], conversas: [], grupos: [] };
let thread = [];              // mensagens da conversa aberta

function verLista()    { $('tela').dataset.onde = 'lista'; }
function verConversa() { $('tela').dataset.onde = 'conversa'; }

// ── Coluna da esquerda ──────────────────────────────────────
function desenharColuna() {
  const naoLidas = dados.recebidas.filter((o) => !o.eu_quero && !o.reservado).length;
  const ultimaDe = (id) => {
    const lista = dados.minhas.filter((o) => (id === '__todos' ? !o.lista_id : o.lista_id === id));
    return lista[0] || null;
  };
  const linha = (icone, nome, sub, hora, ativo, onclick, badge) => `
    <div class="item ${ativo ? 'ativo' : ''}" onclick="${onclick}">
      <div class="avatar">${icone}</div>
      <div class="txt">
        <div class="t1">${esc(nome)}</div>
        <div class="t2">${esc(sub)}</div>
      </div>
      <div class="hora">${hora || ''}${badge ? ` <span class="selo">${badge}</span>` : ''}</div>
    </div>`;

  const recebidasSub = dados.recebidas.length
    ? `${dados.recebidas[0].marca} ${dados.recebidas[0].modelo}`
    : 'nada chegou ainda';

  const listas = dados.listas.map((l) => {
    const u = ultimaDe(l.id);
    return linha('📣', l.nome, u ? `${u.marca} ${u.modelo}` : `${l.membros.filter((m) => m.ativo).length} destinatários`,
      u ? quando(u.criado_em) : '',
      aberto?.tipo === 'lista' && aberto.id === l.id,
      `abrirLista('${l.id}')`);
  }).join('');

  const todos = (() => {
    const u = ultimaDe('__todos');
    return linha('👥', 'Todos os contatos',
      u ? `${u.marca} ${u.modelo}` : `${dados.contatos.length} lojas`,
      u ? quando(u.criado_em) : '',
      aberto?.tipo === 'todos', `abrirTodos()`);
  })();

  $('col').innerHTML =
    `<div class="grupo">Chegou para mim</div>` +
    linha('📥', 'Chegou para mim', recebidasSub,
      dados.recebidas.length ? quando(dados.recebidas[0].criado_em) : '',
      aberto?.tipo === 'recebidos', 'abrirRecebidos()', naoLidas ? String(naoLidas) : '') +
    `<div class="grupo">Transmissões</div>` + todos + listas +
    (dados.grupos.length ? `<div class="grupo">Grupos</div>` + dados.grupos.map((g) => linha(
      '👥', g.nome,
      g.ultima ? `${g.ultima.quem}: ${g.ultima.texto}` : `${g.participantes} participantes`,
      g.ultima ? quando(g.ultima.criado_em) : '',
      aberto?.tipo === 'grupo' && aberto.id === g.id,
      `abrirGrupo('${g.id}')`,
      g.nao_lidas ? String(g.nao_lidas) : '')).join('') : '') +
    (dados.conversas.length ? `<div class="grupo">Conversas</div>` + dados.conversas.map((c) => linha(
      '💬', c.nome,
      c.ultima ? (c.ultima.minha ? 'Você: ' : '') + c.ultima.texto : 'sem mensagens',
      c.ultima ? quando(c.ultima.criado_em) : '',
      aberto?.tipo === 'conversa' && aberto.id === c.conta_id,
      `abrirConversa('${c.conta_id}')`,
      c.nao_lidas ? String(c.nao_lidas) : '')).join('') : '') +
    `<div class="grupo">Contatos · ${dados.contatos.length}</div>` +
    (dados.contatos.length
      // Tocar num contato abre a conversa com ele — como no WhatsApp,
      // onde a agenda e o chat são a mesma porta.
      ? dados.contatos.map((c) => linha('🏪', c.nome, 'tocar para conversar', '', false,
          `abrirConversa('${c.conta_id}')`)).join('')
      : '<div class="vazio" style="padding:1rem">Ninguém na sua rede ainda.</div>');
}

// ── Painel da direita ───────────────────────────────────────
// A distância da FIPE é o número que decide, e estava só no aviso do
// celular — a notificação dizia "8% abaixo da FIPE" e a tela, não. O app
// ficava pior que o aviso dele. (27/set)
function fipeDoCarro(o) {
  const fipe = Number(o.dados && o.dados.fipe) || 0;
  if (!fipe || !o.preco) return '';
  const dif = Math.round((1 - o.preco / fipe) * 100);
  if (dif > 0) return `<span class="selo fipe">${dif}% abaixo da FIPE</span>`;
  // Acima da FIPE não ganha destaque — é informação, não oportunidade.
  if (dif < 0) return `<span class="selo fipe acima">${-dif}% acima da FIPE</span>`;
  return '<span class="selo fipe acima">na FIPE</span>';
}

function balaoDoCarro(o, comFila) {
  const fila = comFila && o.fila ? o.fila : null;
  const foto = (o.dados && Array.isArray(o.dados.fotos) && o.dados.fotos[0]) || '';
  return `
    <div class="balao ${comFila ? '' : 'recebido'}">
      ${foto ? `<img class="foto" src="${esc(foto)}" alt="" loading="lazy"
                    onerror="this.remove()">` : ''}
      <div class="carro">${esc(o.marca)} ${esc(o.modelo)}</div>
      <div class="meta">${esc(o.ano || '—')} · ${numero(o.km)} km${o.cidade ? ' · ' + esc(o.cidade) : ''}</div>
      <div class="linha-preco"><span class="preco">${dinheiro(o.preco)}</span>${fipeDoCarro(o)}</div>
      ${o.mensagem ? `<div class="msg">${esc(o.mensagem)}</div>` : ''}
      ${fila && fila.length ? `<div class="fila">${fila.map((f, i) => `
        <div class="quem"><span>${i + 1}. ${esc(f.nome)}</span>
          ${o.reserva ? '' : `<button class="leve" onclick="reservar('${o.id}','${f.conta_id}')">Reservar</button>`}
        </div>`).join('')}</div>` : ''}
      ${comFila && fila && !fila.length ? '<div class="fila"><div class="quem"><span style="color:var(--text-faint)">Ninguém levantou a mão ainda</span></div></div>' : ''}
      <div class="rodape">
        <span>${quando(o.criado_em)}</span>
        <span>
          ${o.reserva || o.reservado
            ? `<span class="selo res">🔒 Reservado ${(o.reserva?.com_sinal || o.reservado === 'sinal') ? '— sinal' : 'na palavra'}</span>`
            : comFila ? '' : (o.eu_quero ? '<span class="selo">✋ na fila</span>'
                                         : `<button onclick="quero('${o.id}')">✋ Quero</button>`)}
          ${o.reserva && comFila ? `<button class="leve" onclick="desfazer('${o.id}')">Desfazer</button>` : ''}
        </span>
      </div>
    </div>`;
}

function desenharPainel() {
  if (!aberto) return;
  $('pan-nome').textContent = aberto.nome;
  $('pan-icone').textContent = { recebidos: '📥', todos: '👥', conversa: '💬' }[aberto.tipo] || '📣';
  $('compor').hidden = aberto.tipo === 'recebidos';
  // Carro é conteúdo de transmissão. Na conversa 1 a 1 se escreve, como
  // no WhatsApp — o botão do carro só atrapalharia.
  $('btn-carro').hidden = aberto.tipo === 'conversa' || aberto.tipo === 'grupo';
  $('texto').placeholder = (aberto.tipo === 'conversa' || aberto.tipo === 'grupo') ? 'Mensagem' : 'Escreva algo (opcional)…';

  if (aberto.tipo === 'grupo') {
    const g = dados.grupos.find((x) => x.id === aberto.id) || {};
    // O número de participantes aparece; QUEM são, não. É o diferencial
    // do produto, e ele mora tanto no servidor quanto aqui.
    $('pan-sub').innerHTML = `${g.participantes || 0} participantes · ${g.aberto ? 'aberto' : 'fechado'}`
      + (g.sou_admin ? ` · <a href="#" onclick="editarGrupo('${g.id}');return false" style="color:var(--accent)">gerenciar</a>` : '')
      + ` · <a href="#" onclick="sairDoGrupo('${g.id}');return false" style="color:var(--text-faint)">sair</a>`;
    $('thread').innerHTML = thread.length
      ? thread.map((m) => `
        <div class="balao msg-so ${m.minha ? '' : 'recebido'}">
          ${m.minha ? '' : `<div class="meta" style="font-weight:600">${esc(m.quem)}</div>`}
          <div class="msg">${esc(m.texto)}</div>
          <div class="rodape"><span>${quando(m.criado_em)}</span><span></span></div>
        </div>`).join('')
      : '<div class="vazio">Nenhuma mensagem ainda.<br><br>Quem só lê fica invisível — só aparece quem fala.</div>';
    $('thread').scrollTop = $('thread').scrollHeight;
    return;
  }

  if (aberto.tipo === 'conversa') {
    $('pan-sub').textContent = 'conversa direta';
    $('thread').innerHTML = thread.length
      ? thread.map((m) => `
        <div class="balao msg-so ${m.minha ? '' : 'recebido'}">
          <div class="msg">${esc(m.texto)}</div>
          <div class="rodape"><span>${quando(m.criado_em)}</span><span></span></div>
        </div>`).join('')
      : '<div class="vazio">Nenhuma mensagem ainda. Escreva a primeira.</div>';
    $('thread').scrollTop = $('thread').scrollHeight;
    return;
  }

  if (aberto.tipo === 'recebidos') {
    $('pan-sub').textContent = `${dados.recebidas.length} carro(s)`;
    $('thread').innerHTML = dados.recebidas.length
      ? dados.recebidas.map((o) => balaoDoCarro(o, false)).join('')
      : '<div class="vazio">Nada chegou ainda. Aparece aqui quando alguém que tem você na lista mandar um carro.</div>';
    return;
  }

  const lista = aberto.tipo === 'lista' ? dados.listas.find((l) => l.id === aberto.id) : null;
  const destinatarios = lista ? lista.membros.filter((m) => m.ativo).length : dados.contatos.length;
  const inativos = lista ? lista.membros.filter((m) => !m.ativo).length : 0;
  $('pan-sub').innerHTML = `${destinatarios} destinatário(s)`
    + (inativos ? ` · <span style="color:var(--severity-warn)">${inativos} saiu(ram) da sua rede</span>` : '')
    + (lista ? ` · <a href="#" onclick="editarLista('${lista.id}');return false" style="color:var(--accent)">editar</a>` : '');

  const mandadas = dados.minhas.filter((o) => aberto.tipo === 'todos' ? !o.lista_id : o.lista_id === aberto.id);
  $('thread').innerHTML = mandadas.length
    ? mandadas.slice().reverse().map((o) => balaoDoCarro(o, true)).join('')
    : '<div class="vazio">Nada mandado por aqui ainda. Escolha um carro embaixo e envie.</div>';
  $('thread').scrollTop = $('thread').scrollHeight;
}

function abrirLista(id) { const l = dados.listas.find((x) => x.id === id); aberto = { tipo: 'lista', id, nome: l.nome }; desenharColuna(); desenharPainel(); verConversa(); }
function abrirTodos()   { aberto = { tipo: 'todos', id: null, nome: 'Todos os contatos' }; desenharColuna(); desenharPainel(); verConversa(); }
function abrirRecebidos() { aberto = { tipo: 'recebidos', id: null, nome: 'Chegou para mim' }; desenharColuna(); desenharPainel(); verConversa(); }

// ── Conversa 1 a 1 ──────────────────────────────────────────
async function abrirConversa(contaId) {
  try {
    const d = await rede('conversa', { q: `&conta_id=${contaId}` });
    thread = d.mensagens;
    aberto = { tipo: 'conversa', id: contaId, nome: d.nome };
    // Abrir marcou as dela como lidas no servidor; recarregar a coluna é
    // o que faz a bolinha sumir aqui também.
    const c = await rede('conversas');
    dados.conversas = c.conversas;
    desenharColuna(); desenharPainel(); verConversa();
    $('texto').focus();
  } catch (e) { alert(e.message); }
}

// ── Grupo ───────────────────────────────────────────────────
async function abrirGrupo(id) {
  try {
    const d = await rede('grupo', { q: `&grupo_id=${id}` });
    thread = d.mensagens;
    aberto = { tipo: 'grupo', id, nome: d.nome };
    const g = await rede('grupos'); dados.grupos = g.grupos;
    desenharColuna(); desenharPainel(); verConversa();
    $('texto').focus();
  } catch (e) { alert(e.message); }
}

async function falarNoGrupo() {
  const texto = $('texto').value.trim();
  if (!texto) return;
  $('btn-enviar').disabled = true;
  try {
    await rede('falar', { body: { grupo_id: aberto.id, texto } });
    $('texto').value = ''; $('texto').style.height = 'auto';
    await abrirGrupo(aberto.id);
  } catch (e) { alert(e.message); }
  finally { $('btn-enviar').disabled = false; }
}

function novoGrupo() {
  $('dlg-corpo').innerHTML = `<h3>Novo grupo</h3>
    <p style="font-size:.85rem;color:var(--text-mid);line-height:1.55;margin-bottom:.8rem">
      Todos leem o que os outros escrevem. <strong>A lista de participantes fica oculta</strong> —
      quem só lê não aparece. É o que diferencia do WhatsApp.</p>
    <input type="text" id="novo-nome" placeholder="ex: Repasse Litoral SC" maxlength="60">
    <div class="op"><span>Qualquer loja da rede pode entrar</span>
      <input type="checkbox" id="novo-aberto" style="width:auto"></div>
    <div class="op" style="justify-content:flex-end;gap:.5rem">
      <button class="leve" onclick="dlg.close()">Cancelar</button>
      <button onclick="criarGrupo()">Criar</button></div>`;
  $('dlg').showModal(); $('novo-nome').focus();
}
async function criarGrupo() {
  const nome = $('novo-nome').value.trim();
  if (!nome) return $('novo-nome').focus();
  try {
    const r = await rede('grupo', { body: { acao: 'criar', nome, aberto: $('novo-aberto').checked } });
    $('dlg').close(); await carregar(); abrirGrupo(r.grupo.id);
  } catch (e) { alert(e.message); }
}

function editarGrupo(id) {
  const g = dados.grupos.find((x) => x.id === id);
  $('dlg-corpo').innerHTML = `<h3>${esc(g.nome)}</h3>
    <p style="font-size:.85rem;color:var(--text-mid);margin-bottom:.4rem">
      ${g.participantes} participantes. <strong>Nem você vê quem são</strong> — é o desenho.</p>
    <div class="op"><span>Qualquer loja da rede pode entrar</span>
      <button class="${g.aberto ? '' : 'leve'}" onclick="trocarAbertura('${id}', ${!g.aberto})">
        ${g.aberto ? '✓ aberto' : 'fechado'}</button></div>
    <p style="font-size:.8rem;color:var(--text-faint);margin:.5rem 0">Acrescentar dos seus contatos:</p>
    ${dados.contatos.length ? dados.contatos.map((c) => `
      <div class="op"><span>${esc(c.nome)}</span>
        <button class="leve" onclick="acrescentarNoGrupo('${id}','${c.conta_id}')">incluir</button></div>`).join('')
      : '<p class="vazio">Você ainda não tem contatos.</p>'}
    <div class="op" style="justify-content:flex-end"><button onclick="dlg.close()">Pronto</button></div>`;
  $('dlg').showModal();
}
async function trocarAbertura(id, abrir) {
  try { await rede('grupo', { body: { acao: abrir ? 'abrir' : 'fechar', grupo_id: id } }); await carregar(); editarGrupo(id); }
  catch (e) { alert(e.message); }
}
async function acrescentarNoGrupo(id, contaId) {
  try { await rede('grupo', { body: { acao: 'acrescentar', grupo_id: id, conta_id: contaId } }); await carregar(); editarGrupo(id); }
  catch (e) { alert(e.message); }
}
async function sairDoGrupo(id) {
  if (!confirm('Sair deste grupo?')) return;
  try { await rede('grupo', { body: { acao: 'sair', grupo_id: id } }); aberto = null; await carregar(); verLista(); }
  catch (e) { alert(e.message); }
}

async function enviarMensagem() {
  const texto = $('texto').value.trim();
  if (!texto) return;
  $('btn-enviar').disabled = true;
  try {
    await rede('mensagem', { body: { conta_id: aberto.id, texto } });
    $('texto').value = '';
    $('texto').style.height = 'auto';
    await abrirConversa(aberto.id);
  } catch (e) { alert(e.message); }
  finally { $('btn-enviar').disabled = false; }
}

// ── Escolher o carro ────────────────────────────────────────
async function escolherCarro() {
  const r = await fetch('/api/catalogo?status=disponivel');
  const lista = await r.json();
  const carros = (Array.isArray(lista) ? lista : lista.veiculos || []);
  $('dlg-corpo').innerHTML = `<h3>Qual carro?</h3>` + (carros.length
    ? carros.map((v) => `<div class="op">
        <span>${esc(v.marca)} ${esc(v.modelo)}<br>
          <span style="font-size:.78rem;color:var(--text-mid)">${esc(v.ano || '')} · ${numero(v.km)} km · ${dinheiro(v.valor)}</span>
        </span>
        <button onclick='pegarCarro(${JSON.stringify({ id: v.id, marca: v.marca, modelo: v.modelo, valor: v.valor }).replace(/'/g, "&#39;")})'>Escolher</button>
      </div>`).join('')
    : '<p class="vazio">Sem carro disponível no catálogo.</p>')
    + `<div class="op" style="justify-content:flex-end"><button class="leve" onclick="dlg.close()">Fechar</button></div>`;
  $('dlg').showModal();
}
function pegarCarro(v) {
  carroEscolhido = v;
  $('escolhido').hidden = false;
  $('escolhido').innerHTML = `<span>🚗 ${esc(v.marca)} ${esc(v.modelo)} — ${dinheiro(v.valor)}</span>
    <button class="leve" onclick="tirarCarro()">Tirar</button>`;
  $('dlg').close();
  $('texto').focus();
}
function tirarCarro() { carroEscolhido = null; $('escolhido').hidden = true; }

// ── Enviar ──────────────────────────────────────────────────
async function enviar() {
  // Na conversa o conteúdo é o texto; na transmissão é o carro.
  if (aberto && aberto.tipo === 'grupo') return falarNoGrupo();
  if (aberto && aberto.tipo === 'conversa') return enviarMensagem();
  if (!carroEscolhido) return escolherCarro();   // o carro é o conteúdo
  $('btn-enviar').disabled = true;
  try {
    await rede('ofertar', { body: {
      veiculo_id: carroEscolhido.id,
      lista_id: aberto.tipo === 'lista' ? aberto.id : null,
      mensagem: $('texto').value,
      horas_antes_da_vitrine: 6,
    } });
    tirarCarro(); $('texto').value = '';
    await carregar();
  } catch (e) {
    alert(e.corpo?.codigo === 'sem_preco'
      ? 'Este carro está sem preço de repasse.\n\nAbra o Catálogo, preencha o valor e mande de novo.'
      : e.corpo?.codigo === 'lista_vazia'
        ? 'Não há ninguém para receber: essa transmissão está sem destinatário ativo.'
        : e.message);
  } finally { $('btn-enviar').disabled = false; }
}

// ── Ações ───────────────────────────────────────────────────
async function quero(id) {
  try { const r = await rede('quero', { body: { oferta_id: id } }); await carregar(); alert(`Você é o ${r.posicao}º da fila.`); }
  catch (e) { alert(e.message); }
}
async function reservar(ofertaId, contaId) {
  const comSinal = confirm('Entrou sinal na conta?\n\nOK = com sinal · Cancelar = na palavra');
  let valor = null;
  if (comSinal) {
    const v = prompt('Valor do sinal (R$):', '5000'); if (v === null) return;
    valor = Number(String(v).replace(/[^\d,.-]/g, '').replace(',', '.'));
    if (!(valor > 0)) return alert('Valor inválido.');
  }
  const motivo = prompt('Motivo (opcional): aguardando cautelar, documento, carro não entrou…', '') || '';
  try { await rede('reservar', { body: { oferta_id: ofertaId, para_conta_id: contaId, com_sinal: comSinal, valor_sinal: valor, motivo } }); await carregar(); }
  catch (e) { alert(e.message); }
}
async function desfazer(ofertaId) {
  const motivo = prompt('Por que está desfazendo? (fica no histórico)', '') || '';
  try { await rede('desfazer', { body: { oferta_id: ofertaId, motivo } }); await carregar(); }
  catch (e) { alert(e.message); }
}

// ── Transmissões: criar e editar ────────────────────────────
function novaTransmissao() {
  $('dlg-corpo').innerHTML = `<h3>Nova transmissão</h3>
    <p style="font-size:.85rem;color:var(--text-mid);line-height:1.55;margin-bottom:.8rem">
      Um recorte dos seus contatos. Cada um recebe sozinho — ninguém vê quem mais recebeu.</p>
    <input type="text" id="novo-nome" placeholder="ex: Compram acima de 100 mil" maxlength="60">
    <div class="op" style="justify-content:flex-end;gap:.5rem">
      <button class="leve" onclick="dlg.close()">Cancelar</button>
      <button onclick="criarTransmissao()">Criar</button></div>`;
  $('dlg').showModal(); $('novo-nome').focus();
}
async function criarTransmissao() {
  const nome = $('novo-nome').value.trim();
  if (!nome) return $('novo-nome').focus();
  try {
    const r = await rede('transmissao', { body: { acao: 'criar', nome } });
    $('dlg').close(); await carregar(); abrirLista(r.lista.id); editarLista(r.lista.id);
  } catch (e) { alert(e.message); }
}

function editarLista(id) {
  const l = dados.listas.find((x) => x.id === id);
  const dentro = new Set(l.membros.map((m) => m.conta_id));
  $('dlg-corpo').innerHTML = `<h3>${esc(l.nome)}</h3>
    <p style="font-size:.85rem;color:var(--text-mid);margin-bottom:.6rem">Quem recebe desta transmissão:</p>
    ${dados.contatos.length ? dados.contatos.map((c) => `
      <div class="op"><span>${esc(c.nome)}</span>
        <button class="${dentro.has(c.conta_id) ? '' : 'leve'}"
          onclick="trocarMembro('${id}','${c.conta_id}',${!dentro.has(c.conta_id)})">
          ${dentro.has(c.conta_id) ? '✓ recebe' : 'incluir'}</button></div>`).join('')
      : '<p class="vazio">Você ainda não tem contatos.</p>'}
    <div class="op" style="justify-content:space-between">
      <button class="leve" onclick="apagarLista('${id}')">Apagar transmissão</button>
      <button onclick="dlg.close()">Pronto</button></div>`;
  $('dlg').showModal();
}
async function trocarMembro(listaId, contaId, dentro) {
  try { await rede('membro', { body: { lista_id: listaId, conta_id: contaId, dentro } }); await carregar(); editarLista(listaId); }
  catch (e) { alert(e.message); }
}
async function apagarLista(id) {
  if (!confirm('Apagar esta transmissão? Os carros já mandados continuam valendo.')) return;
  try { await rede('transmissao', { body: { acao: 'apagar', lista_id: id } }); $('dlg').close(); aberto = null; await carregar(); verLista(); }
  catch (e) { alert(e.message); }
}

// ── Carregar tudo ───────────────────────────────────────────
async function carregar() {
  const [t, l, f, m, c, g] = await Promise.all([
    rede('transmissao'), rede('listas'), rede('feed'), rede('minhas'), rede('conversas'), rede('grupos'),
  ]);
  dados = { listas: t.listas, contatos: l.membros, recebidas: f.ofertas, minhas: m.ofertas, conversas: c.conversas, grupos: g.grupos };
  desenharColuna();
  if (aberto) desenharPainel();
}

(async () => {
  // Sem sessão a rede não abre, e a tela precisa dizer isso com todas as
  // letras em vez de ficar vazia — a chave do aparelho não diz de que
  // loja a pessoa é.
  // As duas viagens saem JUNTAS. Antes, a tela perguntava quem é você e
  // só depois carregava — uma ida e volta inteira parada, e é a primeira,
  // justamente a que pega a função fria na Vercel (medido em 27/set: 770 ms
  // fria contra ~200 ms quente).
  //
  // Sem sessão, `carregar()` volta 401 — o `catch` aqui existe para essa
  // recusa não virar erro não tratado enquanto ninguém está esperando por
  // ela. Quem decide o que a tela mostra continua sendo a resposta do
  // `quem`, logo abaixo.
  const jaCarregando = carregar().catch(() => null);
  try {
    const d = await (await fetch('/api/utils?type=quem', { cache: 'no-store' })).json();
    if (!d.sessao) {
      $('col').innerHTML = '<div class="aviso"><strong>Entre com o seu telefone.</strong> '
        + 'A rede precisa saber de que loja você é — a chave do aparelho não diz isso.<br><br>'
        + '<a href="/entrar.html" style="color:var(--accent)">Entrar agora</a></div>';
      return;
    }
    // Já está a caminho desde o começo; aqui só se espera terminar. Se
    // tiver falhado, refaz — assim o erro aparece com a mensagem certa em
    // vez de a tela ficar vazia sem explicação.
    if ((await jaCarregando) === null) await carregar();
    abrirRecebidos(); verLista();
  } catch (e) {
    $('col').innerHTML = `<div class="aviso">Não consegui carregar: ${esc(e.message)}</div>`;
  }
})();

$('btn-nova').addEventListener('click', () => {
  $('dlg-corpo').innerHTML = '<h3>Criar</h3>' +
    '<div class="op"><span>📣 <strong>Transmissão</strong><br><span style="font-size:.78rem;color:var(--text-mid)">manda carro para vários — ninguém vê quem mais recebeu</span></span>' +
      '<button onclick="novaTransmissao()">Criar</button></div>' +
    '<div class="op"><span>👥 <strong>Grupo</strong><br><span style="font-size:.78rem;color:var(--text-mid)">todos conversam — e a lista de participantes fica oculta</span></span>' +
      '<button onclick="novoGrupo()">Criar</button></div>' +
    '<div class="op" style="justify-content:flex-end"><button class="leve" onclick="dlg.close()">Fechar</button></div>';
  $('dlg').showModal();
});
// ── Ser avisado no celular ──────────────────────────────────
// A chave pública identifica o remetente do aviso; ela vai para o
// navegador de qualquer jeito, então não é segredo.
const VAPID_PUBLICA = 'BBC7R1zlyfXM0Rd5QUsxrWAO0NTvLL8kCewulHJVEMRm1uKuL3OvSWzXKe3CZ-CW7KpzGqbIUKn5vgRjfYcn_YM';
const paraBytes = (b64) => {
  const s = (b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/');
  return Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
};

async function pedirAviso() {
  // Cada motivo tem a sua frase: "não deu" sem dizer por quê faz a
  // pessoa tentar de novo esperando outro resultado.
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    return alert('Este navegador não recebe aviso.\n\nNo iPhone, só funciona com o app na tela de início:\nabra pelo Safari e use Compartilhar → Adicionar à Tela de Início.');
  }
  try {
    const permissao = await Notification.requestPermission();
    if (permissao !== 'granted') {
      return alert('Sem permissão, não dá para avisar.\n\nSe você recusou sem querer, libere nas configurações do navegador para este site.');
    }
    const reg = await navigator.serviceWorker.ready;
    const ass = await reg.pushManager.subscribe({
      userVisibleOnly: true,                       // exigido: todo aviso aparece
      applicationServerKey: paraBytes(VAPID_PUBLICA),
    });
    const j = ass.toJSON();
    const r = await rede('assinar', { body: { endpoint: j.endpoint, p256dh: j.keys?.p256dh, auth: j.keys?.auth } });
    $('btn-avisar').classList.remove('leve');
    // O aparelho pode estar assinado e o envio desligado no servidor. Dizer
    // "pronto" nesse caso seria prometer um aviso que nunca sai.
    if (r && r.ligado === false) {
      alert('Este aparelho ficou registrado, mas o envio de avisos ainda está desligado no servidor.\n\nNada foi perdido: assim que ligar, os avisos passam a chegar aqui sem você precisar refazer nada.');
    } else {
      alert('Pronto. Você será avisado quando chegar carro ou mensagem.');
    }
  } catch (e) {
    alert('Não consegui ligar o aviso: ' + e.message);
  }
}
$('btn-avisar').addEventListener('click', pedirAviso);

$('btn-carro').addEventListener('click', escolherCarro);
$('btn-enviar').addEventListener('click', enviar);
$('texto').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); }
});
$('texto').addEventListener('input', (e) => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 128) + 'px';
});
</script>
